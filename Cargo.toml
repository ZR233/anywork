[workspace]
members = [
    "code/pl-agent-tool",
    "code/pl-agent-tool-macros",
    "code/pl-protocol",
    "code/pl-trace",
    "code/pl-model",
    "code/pl-acp",
    "code/pl-provider-fixture",
    "code/pl-lsp",
    "code/pl-output",
    "code/pl-patch",
    "code/pl-skill-core",
    "code/pl-core",
    "code/pl-dev-support",
    "code/pl-tool",
    "code/tools/apply-patch",
    "code/tools/stat-path",
    "code/tools/write-file",
    "code/tools/create-directory",
    "code/tools/delete-path",
    "code/tools/copy-path",
    "code/tools/move-path",
    "code/tools/support/filesystem",
    "code/tools/exec",
    "code/tools/write-stdin",
    "code/tools/lsp-capabilities",
    "code/tools/lsp-query",
    "code/tools/support/process",
    "code/tools/support/lsp",
    "code/tools/support/media",
    "code/tools/support/mcp",
    "code/tools/mcp",
    "code/tools/list-mcp-resources",
    "code/tools/list-mcp-resource-templates",
    "code/tools/read-mcp-resource",
    "code/tools/view-image",
    "code/tools/generate-image",
    "code/tools/show-image",
    "code/tools/git-status",
    "code/tools/git-diff",
    "code/tools/git-branch",
    "code/tools/git-fetch",
    "code/tools/git-commit",
    "code/tools/git-push",
    "code/tools/git-workspace-info",
    "code/tools/git-sync-default-branch",
    "code/tools/support/git",
    "code/tools/web-search",
    "code/tools/deepseek-web-search",
    "code/tools/deepseek-web-fetch",
    "code/tools/skills-list",
    "code/tools/skill-view",
    "code/tools/skill-manage",
    "code/tools/list-bots",
    "code/tools/list-bot-conversations",
    "code/tools/read-bot-messages",
    "code/tools/send-bot-message",
    "code/tools/support/search",
    "code/tools/support/skill",
    "code/tools/support/bots",
    "code/pl-remote-helper",
    "code/pl-studio-runtime",
    "code/pl-studio-acceptance",
    "code/pl-studio-server",
    "code/anywork/rust",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
criterion = { version = "=0.8.2", features = ["async_tokio"] }
agent-client-protocol = { version = "=3.4.0", default-features = false }
percent-encoding = "2.3.2"
procfs = { version = "0.18.0", default-features = false }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-webpki-roots"] }
tower = "0.5.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
syn = { version = "2.0.119", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
encoding_rs = "0.8.42"
prost = "0.14.4"
flate2 = "1"
schemars = "=1.2.3"
serde_norway = "0.9"
rust-embed = { version = "=8.13.0", features = [
    "compression",
    "debug-embed",
    "deterministic-timestamps",
] }
thiserror = "2"
anyhow = "1"
libc = "0.2.191"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rolling-file = "0.2"
keyring = "4.2.0"
tempfile = "3"
ignore = "0.4"
gray_matter = "0.3.2"
base64 = "0.23"
which = "8"
dunce = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
downlowd = "0.1.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rawzip = "=0.5.2"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
h2 = "0.4.20"
http = "1.5"
bytes = "1.12"
getrandom = "0.4"
sse-stream = "0.2.6"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
eventsource-stream = "0.2.3"
enum_dispatch = "=0.3.13"
secrecy = "0.10"
axum = "0.8"
fs4 = "=1.1.0"
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
utoipa-swagger-ui = { version = "=10.0.1", features = ["axum", "vendored"] }
rmcp = { version = "=3.5.1", default-features = false }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
lsp-server = "0.10"
lsp-types = "0.97.0"
toml = "1.1.8"
version-migrate = "=0.21.0"
pretty_assertions = "1.4.1"
# SQLite does not need SQLx TLS; enabling it would add rustls ring beside reqwest's AWS-LC provider.
sea-orm = { version = "2.0.4", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "sqlx-sqlite",
] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = [
    "runtime-tokio",
    "sqlx-sqlite",
] }
# Native history metadata uses SQLx's locked handle and the same SQLite binding identity.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "=0.37.0", default-features = false }
sha2 = "0.11.1"
hex = "0.4.3"
zstd = { version = "0.14.3", default-features = false }
semver = "1"
url = "2"
oauth2 = { version = "5.0.0", default-features = false, features = ["timing-resistant-secret-traits"] }
openidconnect = { version = "4.0.1", default-features = false }
uuid = { version = "1.28.0", features = ["v4"] }
minisign-verify = "0.3.0"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
grep-searcher = "0.1.17"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }
zeroize = "1.9.1"
windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
] }

pl-protocol = { path = "code/pl-protocol" }
pl-agent-tool = { path = "code/pl-agent-tool", version = "0.1.0", default-features = false }
pl-agent-tool-macros = { path = "code/pl-agent-tool-macros", version = "0.1.0" }
pl-trace = { path = "code/pl-trace" }
