[package]
name = "pl-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pl-agent-tool = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile = { workspace = true }
# `test-util` (dev only) provides the paused clock (`start_paused` / `time::advance`) the window
# tests use to prove the coalescing deadline is fixed deterministically instead of with real sleeps.
# Production dependencies keep tokio's workspace feature set unchanged.
tokio = { workspace = true, features = ["test-util"] }
