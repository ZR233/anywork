name: anywork
description: anywork desktop application.
publish_to: 'none'

# Release Please updates this stable SemVer in its reviewed Release PR.
# Windows uses these major, minor, and patch components for product and file versions.
version: 6.37.0 # x-release-please-version

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'

dependencies:
  anywork_client:
    path: ../anywork_client
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  flutter_rust_bridge: 2.13.0
  gpt_markdown: 1.4.1
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.8
  desktop_drop: ^0.9.2
  pasteboard: ^0.6.0
  tray_manager: ^0.8.3
  flutter_svg: ^2.3.2
  flutter_chat_core: ^2.9.1
  flutter_chat_ui: ^2.12.0
  flyer_chat_text_message: ^2.6.1
  flyer_chat_text_stream_message: ^2.3.1
  flyer_chat_image_message: ^2.3.1
  flyer_chat_file_message: ^2.4.1
  multi_split_view: 3.6.2
  vyuh_node_flow: 0.32.0
  pretty_qr_code: 3.6.0
  url_launcher: 6.3.3
  path: 1.9.1
  material_ui: ^1.10.0
dependency_overrides:
  cross_cache:
    path: packages/cross_cache
dev_dependencies:
  analyzer: 14.7.0
  args: 2.7.0
  ffi: ^2.2.0
  win32: ^6.4.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0
  go_router_builder: ^4.5.3
  vm_service: 15.4.0
  flutter_driver:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/anywork-app-icon.png
    - assets/branding/anywork-startup-cat.webp
    - assets/branding/anywork-startup-cat.png
    - assets/provider-logos/

flutter_rust_bridge:
  rust_root: rust/
  rust_input: crate::api
  dart_output: lib/src/rust
  rust_output: rust/src/frb_generated.rs
