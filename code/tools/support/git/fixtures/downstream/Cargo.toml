[workspace]

[package]
name = "git-tools-downstream"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
pl-agent-tool = { path = "../../../../../pl-agent-tool", features = ["typed"] }
pl-tool-git-support = { path = "../.." }
pl-tool-git-status = { path = "../../../../git-status" }
pl-tool-git-diff = { path = "../../../../git-diff" }
pl-tool-git-branch = { path = "../../../../git-branch" }
pl-tool-git-fetch = { path = "../../../../git-fetch" }
pl-tool-git-commit = { path = "../../../../git-commit" }
pl-tool-git-push = { path = "../../../../git-push" }
pl-tool-git-workspace-info = { path = "../../../../git-workspace-info" }
pl-tool-git-sync-default-branch = { path = "../../../../git-sync-default-branch" }
serde_json = "1.0.154"
tempfile = "3"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync"] }
