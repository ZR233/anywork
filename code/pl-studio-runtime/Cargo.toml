[package]
name = "pl-studio-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
live-tests = []
benchmarks = ["dep:criterion"]

[dev-dependencies]
pl-provider-fixture = { workspace = true }

[dependencies]
criterion = { workspace = true, optional = true }
pl-remote-helper = { workspace = true }
pl-acp = { workspace = true }
pl-model = { workspace = true }
pl-core = { workspace = true, features = ["sqlite"] }
pl-tool = { workspace = true }
pl-protocol = { workspace = true }
pl-trace = { workspace = true }
pl-lsp = { workspace = true }
anyhow = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
prost = { workspace = true }
flate2 = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
version-migrate = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
downlowd = { workspace = true }
rawzip = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }
tempfile = { workspace = true }
minisign-verify = { workspace = true }
fs4 = { workspace = true }
rust-embed = { workspace = true }
dunce = { workspace = true }
dirs = { workspace = true }
zstd = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# 非 Linux 平台启动 ACP 官方程序走统一后台进程工厂（process-wrap）；Linux 复用 bundled
# 受监督 worker，因此不需要该依赖。
[target.'cfg(not(target_os = "linux"))'.dependencies]
process-wrap = { workspace = true }

[[example]]
name = "collaboration_observe"
required-features = ["live-tests"]

[[example]]
name = "model_observe"
required-features = ["live-tests"]

[build-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[[example]]
name = "context_cache_observe"
required-features = ["live-tests"]

[[example]]
name = "context_cache_matrix"
required-features = ["live-tests"]

[[example]]
name = "updater_observe"
required-features = ["live-tests"]

[[bench]]
name = "statistics_pipeline"
harness = false
test = false
required-features = ["benchmarks"]
