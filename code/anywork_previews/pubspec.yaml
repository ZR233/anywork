name: anywork_previews
description: Development-only Widget Previewer catalog for anywork.
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  anywork:
    path: ../anywork
  anywork_client:
    path: ../anywork_client
  flutter:
    sdk: flutter
  flutter_chat_core: ^2.9.1
  material_ui: ^1.11.0

dev_dependencies:
  flutter_lints: ^6.0.0

# Pub overrides are root-scoped. Keep this development root on the same local
# cache implementation and diff API as the application.
dependency_overrides:
  cross_cache:
    path: ../anywork/packages/cross_cache
  diffutil_dart: 5.0.0
