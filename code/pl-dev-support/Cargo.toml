[package]
name = "pl-dev-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3.5", features = ["termination"] }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
ctrlc = { version = "3.5", features = ["termination"] }
nix = { version = "0.31", features = ["signal"] }
process-wrap = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Shared Job handle and corrected creation flags are not in crates.io 10.0.1.
# Keep the engineering-only dependency pinned until an official release includes them.
process-wrap-windows = { package = "process-wrap", git = "https://github.com/watchexec/process-wrap", rev = "2f4bc393d8bd03b4b1c81fee2e13ce82dd42906e", default-features = false, features = ["std", "job-object", "creation-flags"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
