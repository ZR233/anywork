name: Restore PR quality input
description: Verify a same-run tool or helper archive before exposing it to a consumer.
inputs:
  kind:
    description: tool or helpers.
    required: true
  artifact-id:
    description: Exact same-run producer artifact ID.
    required: true
  sha256:
    description: Producer archive SHA-256.
    required: true
  source-sha:
    description: Producer source commit.
    required: true
  workspace:
    description: Tool compilation workspace (tools only).
    default: ''
  environment:
    description: Tool compilation image identity (tools only).
    default: ''
runs:
  using: composite
  steps:
    - name: Require an explicit producer
      shell: bash
      env:
        INPUT_ID: ${{ inputs.artifact-id }}
        INPUT_KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        case "$INPUT_KIND" in tool|helpers) ;; *) echo "Invalid quality input kind" >&2; exit 1 ;; esac
        python3 .github/scripts/pr_quality_handoff.py require-id "$INPUT_ID"
    - name: Download the exact archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        merge-multiple: true
        path: ${{ runner.temp }}/quality-${{ inputs.kind }}
    - name: Verify and restore the input
      shell: bash
      env:
        INPUT_KIND: ${{ inputs.kind }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        INPUT_SOURCE: ${{ inputs.source-sha }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/quality-$INPUT_KIND/quality.tar.gz"
        common=(--archive "$archive" --sha256 "$INPUT_SHA256" --source-sha "$INPUT_SOURCE")
        if [ "$INPUT_KIND" = tool ]; then
          python3 .github/scripts/pr_quality_handoff.py restore-tool "${common[@]}" \
            --workspace "$INPUT_WORKSPACE" --environment "$INPUT_ENVIRONMENT" \
            --expected-environment "${LINUX_BUILD_IMAGE:?exact Linux environment must be restored first}" \
            --destination target/ci-tools
          echo "PR_QUALITY_XTASK=$GITHUB_WORKSPACE/target/ci-tools/pl-xtask" >> "$GITHUB_ENV"
        else
          python3 .github/scripts/pr_quality_handoff.py restore-helpers "${common[@]}" \
            --destination dist/remote-helper
          echo "PURE_REMOTE_HELPER_PREBUILT_DIR=$GITHUB_WORKSPACE/dist/remote-helper" >> "$GITHUB_ENV"
        fi
