name: Restore PR quality input
description: Verify a same-run tool, helper or test input archive before exposing it to a consumer.
inputs:
  kind:
    description: tool, helpers or tests.
    required: true
  artifact-id:
    description: Exact same-run producer artifact ID.
    required: true
  sha256:
    description: Producer archive SHA-256.
    required: true
  source-sha:
    description: Producer source commit.
    required: true
  workspace:
    description: Compilation workspace (tool and test inputs).
    default: ''
  environment:
    description: Compilation image identity (tool and test inputs).
    default: ''
runs:
  using: composite
  steps:
    - name: Require an explicit producer
      shell: bash
      env:
        INPUT_ID: ${{ inputs.artifact-id }}
        INPUT_KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        case "$INPUT_KIND" in tool|helpers|tests) ;; *) echo "Invalid quality input kind" >&2; exit 1 ;; esac
        python3 .github/scripts/pr_quality_handoff.py require-id "$INPUT_ID"
    - name: Download the exact archive
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        merge-multiple: true
        path: ${{ runner.temp }}/quality-${{ inputs.kind }}
    - name: Verify and restore the input
      shell: bash
      env:
        INPUT_KIND: ${{ inputs.kind }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        INPUT_SOURCE: ${{ inputs.source-sha }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/quality-$INPUT_KIND/quality.tar.gz"
        common=(--archive "$archive" --sha256 "$INPUT_SHA256" --source-sha "$INPUT_SOURCE")
        if [ "$INPUT_KIND" = tool ] || [ "$INPUT_KIND" = tests ]; then
          # Cargo cache restores may retain or clean target/ci-tools; keep this run's input outside it.
          python3 .github/scripts/pr_quality_handoff.py "restore-$INPUT_KIND" "${common[@]}" \
            --workspace "$INPUT_WORKSPACE" --environment "$INPUT_ENVIRONMENT" \
            --expected-environment "${LINUX_BUILD_IMAGE:?exact Linux environment must be restored first}" \
            --destination "output/ci-quality-$INPUT_KIND"
          if [ "$INPUT_KIND" = tool ]; then
            echo "PR_QUALITY_XTASK=$GITHUB_WORKSPACE/output/ci-quality-tool/pl-xtask" >> "$GITHUB_ENV"
          else
            echo "ANYWORK_CI_TEST_INPUTS=$GITHUB_WORKSPACE/output/ci-quality-tests" >> "$GITHUB_ENV"
          fi
        else
          python3 .github/scripts/pr_quality_handoff.py restore-helpers "${common[@]}" \
            --destination dist/remote-helper
          echo "PURE_REMOTE_HELPER_PREBUILT_DIR=$GITHUB_WORKSPACE/dist/remote-helper" >> "$GITHUB_ENV"
        fi
