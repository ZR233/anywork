name: Restore prebuilt Studio CLI
description: Download the same-run anywk artifact by ID and verify its payload before extracting it.
inputs:
  artifact-id:
    description: Immutable producer artifact ID from this workflow run.
    required: true
  archive-sha256:
    description: SHA-256 of the tar payload reported by the producer.
    required: true
runs:
  using: composite
  steps:
    - name: Require the immutable anywk producer ID
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
      run: |
        if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
          printf 'Missing or invalid anywk producer artifact ID: %s\n' "$ARTIFACT_ID" >&2
          exit 1
        fi
    - name: Download the anywk archive from this run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        merge-multiple: true
        path: ${{ runner.temp }}/studio-anywk
    - name: Verify and extract prebuilt anywk inputs
      shell: bash
      env:
        ANYWK_ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
      run: bash .github/scripts/studio-anywk-handoff.sh restore
