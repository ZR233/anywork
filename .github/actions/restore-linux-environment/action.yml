name: Restore exact Linux environment
description: Consume an immutable image or the same-run candidate without changing its identity.
inputs:
  image-ref:
    description: Published immutable image reference.
    default: ''
  image-id:
    description: Same-run candidate image ID.
    default: ''
  artifact-id:
    description: Same-run candidate archive artifact ID.
    default: ''
  archive-sha256:
    description: Candidate archive digest.
    default: ''
runs:
  using: composite
  steps:
    - name: Download same-run candidate environment
      if: inputs.artifact-id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        merge-multiple: true
        path: ${{ runner.temp }}/linux-build-image
    - name: Verify exact environment identity
      shell: bash
      env:
        LINUX_IMAGE_REF: ${{ inputs.image-ref }}
        LINUX_IMAGE_ID: ${{ inputs.image-id }}
        LINUX_IMAGE_ARTIFACT_ID: ${{ inputs.artifact-id }}
        LINUX_IMAGE_ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
      run: bash .github/scripts/linux-build-handoff.sh
