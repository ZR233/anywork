name: Studio Release Publish

on:
  workflow_call:
    inputs:
      releaseId:
        description: Exact GitHub Release ID created by Release Please
        required: true
        type: string
  workflow_dispatch:
    inputs:
      releaseId:
        description: Exact GitHub Release ID created by Release Please
        required: true
        type: string

concurrency:
  group: studio-stable-release-publish
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Resolve immutable Release source
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
      releaseId: ${{ steps.release.outputs.releaseId }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      linux: ${{ steps.release.outputs.linux }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve Release ID, tag, version, and commit
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.releaseId }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw "Studio publisher must run from main, not $env:GITHUB_REF"
          }
          if ($env:GITHUB_REPOSITORY -cne 'ZR233/anywork') {
            throw "Studio publisher cannot run for repository $env:GITHUB_REPOSITORY"
          }
          if ($env:RELEASE_ID -notmatch '^[1-9]\d*$') {
            throw "Release ID must be a positive decimal integer: $env:RELEASE_ID"
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read GitHub Release $env:RELEASE_ID"
          }
          $expectedApiUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          $expectedUploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets{?name,label}"
          if (
            [string]$release.id -cne $env:RELEASE_ID -or
            $release.url -cne $expectedApiUrl -or
            $release.upload_url -cne $expectedUploadUrl
          ) {
            throw "Release $env:RELEASE_ID belongs to an unexpected repository or API resource"
          }
          if ($release.prerelease) {
            throw "Release $env:RELEASE_ID must not be a prerelease"
          }
          if ($release.tag_name -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Release tag must be stable v-prefixed SemVer: $($release.tag_name)"
          }
          $version = $Matches['version']
          $tag = "v$version"
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          Assert-StudioReleasePageUrl `
            -Release $release `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $tag

          git fetch --force origin `
            'refs/heads/main:refs/remotes/origin/main' `
            "refs/tags/${tag}:refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch main and immutable tag $tag"
          }
          $sha = (git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw "Failed to resolve commit for tag $tag"
          }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag commit $sha is not contained in origin/main"
          }
          if ($release.target_commitish -cne 'main' -and $release.target_commitish -cne $sha) {
            throw "Release target $($release.target_commitish) does not identify main or tag commit $sha"
          }

          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-superseded-releases.ps1')
          $superseded = Get-StudioSupersededReleases -WorkspaceRoot $env:GITHUB_WORKSPACE
          if ($release.draft -and $superseded.ContainsKey($tag)) {
            throw "Draft $tag has been superseded: $($superseded[$tag].reason). Prepare the next Release PR instead."
          }

          $rootVersion = (git show "${sha}:studio-version.txt").Trim()
          if ($LASTEXITCODE -ne 0 -or $rootVersion -cne $version) {
            throw "Tag $tag does not contain matching studio-version.txt"
          }
          $pubspec = git show "${sha}:code/anywork/pubspec.yaml"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag does not contain the Flutter pubspec"
          }
          $pubspecMatches = [regex]::Matches(
            ($pubspec -join "`n"),
            '(?m)^version:\s*(?<version>\S+)\s+#\s*x-release-please-version\s*$'
          )
          if ($pubspecMatches.Count -ne 1 -or $pubspecMatches[0].Groups['version'].Value -cne $version) {
            throw "Tag $tag does not contain the matching annotated Flutter version"
          }
          $manifest = (git show "${sha}:.release-please-manifest.json") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $manifest.'.' -cne $version) {
            throw "Tag $tag does not contain the matching Release Please manifest version"
          }

          # Resolve asset policy from the trusted immutable tag, not today's main.
          # Published historical four-asset Releases must never acquire new assets.
          $assetPolicy = git show "${sha}:.github/scripts/studio-release-assets.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Immutable source lacks its release asset policy' }
          . ([scriptblock]::Create(($assetPolicy -join "`n")))
          $expectedNames = @(Get-StudioReleaseAssetNames -Version $version)
          $linux = $expectedNames -ccontains "anywork-$version-linux-x86_64.deb"
          Assert-StudioReleaseRemoteAssets `
            -Release $release `
            -ExpectedNames $expectedNames `
            -RequireComplete:(-not [bool]$release.draft)

          "draft=$($release.draft.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "releaseId=$env:RELEASE_ID" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "linux=$($linux.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  linux-environment:
    name: Resolve published Linux build environment
    needs: resolve
    if: needs.resolve.outputs.draft == 'true'
    uses: ./.github/workflows/linux-build-environment.yml
    permissions:
      contents: read
    with:
      sourceRef: ${{ needs.resolve.outputs.sha }}
      mode: resolve

  helper:
    name: Build Linux remote helper (${{ matrix.target }})
    outputs:
      x64ArtifactId: ${{ steps.helper-x64.outputs.artifact-id }}
      arm64ArtifactId: ${{ steps.helper-arm64.outputs.artifact-id }}
    needs: [resolve, linux-environment]
    if: needs.resolve.outputs.draft == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    permissions:
      contents: read
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Download same-run candidate environment
        if: needs.linux-environment.outputs.artifactId != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux-environment.outputs.artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-build-image

      - name: Verify exact environment identity
        env:
          LINUX_IMAGE_REF: ${{ needs.linux-environment.outputs.imageRef }}
          LINUX_IMAGE_ID: ${{ needs.linux-environment.outputs.imageId }}
          LINUX_IMAGE_ARTIFACT_ID: ${{ needs.linux-environment.outputs.artifactId }}
          LINUX_IMAGE_ARCHIVE_SHA256: ${{ needs.linux-environment.outputs.archiveSha256 }}
        run: bash .github/scripts/linux-build-handoff.sh

      - name: Build remote helper architecture
        env:
          HELPER_TARGET: ${{ matrix.target }}
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" \
            env PURE_REMOTE_HELPER_BUILDER=zigbuild cargo xtask build-remote-helper --target "$HELPER_TARGET"

      - name: Preserve x64 helper
        id: helper-x64
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-bundled-helper-${{ needs.resolve.outputs.releaseId }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: dist/remote-helper/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve arm64 helper
        id: helper-arm64
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-bundled-helper-${{ needs.resolve.outputs.releaseId }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: dist/remote-helper/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  compile:
    name: Compile Windows x64 checkpoint
    needs:
      - resolve
      - helper
    if: needs.resolve.outputs.draft == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      bundleArtifactId: ${{ steps.bundle.outputs.artifact-id }}
      toolArtifactId: ${{ steps.tool.outputs.artifact-id }}
      bundleSha256: ${{ steps.checkpoint.outputs.bundleSha256 }}
      toolSha256: ${{ steps.checkpoint.outputs.toolSha256 }}
      toolWorkspace: ${{ steps.checkpoint.outputs.toolWorkspace }}
    env:
      PURE_REMOTE_HELPER_PREBUILT_DIR: ${{ github.workspace }}/dist/remote-helper
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Require both helper producer identities
        shell: pwsh
        env:
          HELPER_X64_ID: ${{ needs.helper.outputs.x64ArtifactId }}
          HELPER_ARM64_ID: ${{ needs.helper.outputs.arm64ArtifactId }}
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:HELPER_X64_ID
          Assert-StudioArtifactId -Id $env:HELPER_ARM64_ID

      - name: Download helper bundle inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.helper.outputs.x64ArtifactId }}
          merge-multiple: true
          path: dist/remote-helper/x86_64-unknown-linux-musl

      - name: Download ARM64 helper bundle inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.helper.outputs.arm64ArtifactId }}
          merge-multiple: true
          path: dist/remote-helper/aarch64-unknown-linux-musl

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          # Same Windows GUI product set as the RC workflow.
          shared-key: gui-windows
          workspaces: |
            . -> target
            . -> target/xtask

      - name: Build GUI bundle and release tool
        run: cargo xtask build-gui

      - name: Archive runtime bundle and identify release tool
        id: checkpoint
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          New-StudioCompileCheckpoint

      - name: Preserve runtime bundle checkpoint immediately
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ needs.resolve.outputs.releaseId }}-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve independent release tool
        id: tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ needs.resolve.outputs.releaseId }}-tool-${{ github.run_attempt }}
          path: target/xtask/debug/pl-xtask.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package:
    name: Package, sign, and smoke-test Windows x64
    needs: [resolve, compile]
    if: needs.resolve.outputs.draft == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifactId: ${{ steps.archive.outputs.artifact-id }}
      archiveSha256: ${{ steps.identity.outputs.archiveSha256 }}
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      BUNDLE_ARTIFACT_ID: ${{ needs.compile.outputs.bundleArtifactId }}
      BUNDLE_SHA256: ${{ needs.compile.outputs.bundleSha256 }}
      TOOL_ARTIFACT_ID: ${{ needs.compile.outputs.toolArtifactId }}
      TOOL_SHA256: ${{ needs.compile.outputs.toolSha256 }}
      TOOL_WORKSPACE: ${{ needs.compile.outputs.toolWorkspace }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Require immutable runtime bundle artifact ID
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:BUNDLE_ARTIFACT_ID

      - name: Download runtime bundle from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.BUNDLE_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-bundle

      - name: Verify and restore runtime bundle
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioBundle

      - name: Require immutable release tool artifact ID
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:TOOL_ARTIFACT_ID

      - name: Download release tool from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.TOOL_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-tool

      - name: Verify and restore release tool
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioReleaseTool

      - name: Install pinned release packaging tools
        shell: pwsh
        run: |
          . .github/scripts/studio-package-tools.ps1
          Install-StudioInnoSetup
          Install-StudioMinisign

      - name: Materialize optional Authenticode certificate
        shell: pwsh
        env:
          AUTHENTICODE_CERTIFICATE_BASE64: ${{ secrets.AUTHENTICODE_CERTIFICATE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_CERTIFICATE_BASE64)) {
            $certificate = Join-Path $env:RUNNER_TEMP 'anywork-authenticode.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:AUTHENTICODE_CERTIFICATE_BASE64))
            "WINDOWS_CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signTool) { throw 'signtool.exe not found' }
            "WINDOWS_SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Stage installer from verified prebuilt bundle
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.AUTHENTICODE_CERTIFICATE_PASSWORD }}
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioProductVersion -Executable (Join-Path $env:STUDIO_RELEASE_BUNDLE 'anywork.exe') -Version $env:RELEASE_VERSION
          & $env:STUDIO_RELEASE_TOOL release-gui stage --version $env:RELEASE_VERSION --bundle $env:STUDIO_RELEASE_BUNDLE
          if ($LASTEXITCODE -ne 0) { throw "Package staging exited with $LASTEXITCODE" }

      - name: Remove Authenticode certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH) -and (Test-Path -LiteralPath $env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_PATH -Force
          }

      - name: Materialize Minisign credentials
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MINISIGN_SECRET_KEY)) {
            throw 'MINISIGN_SECRET_KEY secret is required'
          }
          if ([string]::IsNullOrWhiteSpace($env:MINISIGN_PASSWORD)) {
            throw 'MINISIGN_PASSWORD secret is required'
          }
          $minisignKey = Join-Path $env:RUNNER_TEMP 'anywork.key'
          Set-Content -LiteralPath $minisignKey -Value $env:MINISIGN_SECRET_KEY -NoNewline
          "MINISIGN_SECRET_KEY_FILE=$minisignKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Finalize and verify signed release
        shell: pwsh
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          & $env:STUDIO_RELEASE_TOOL release-gui finalize --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Release finalization exited with $LASTEXITCODE" }

      - name: Remove Minisign secret key
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MINISIGN_SECRET_KEY_FILE) -and (Test-Path -LiteralPath $env:MINISIGN_SECRET_KEY_FILE)) {
            Remove-Item -LiteralPath $env:MINISIGN_SECRET_KEY_FILE -Force
          }

      - name: Smoke-test per-user installer
        shell: pwsh
        run: |
          . .github/scripts/studio-package-tools.ps1
          Test-StudioInstaller

      - name: Identify final asset archive
        id: identity
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $archive = Join-Path $env:RUNNER_TEMP 'assets.zip'
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $archive
          "archiveSha256=$((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preserve final assets before online attestation
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-release-${{ needs.resolve.outputs.releaseId }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attest:
    name: Attest archived installer provenance
    needs: [resolve, package]
    if: needs.resolve.outputs.draft == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      ASSET_ARTIFACT_ID: ${{ needs.package.outputs.artifactId }}
      ASSET_SHA256: ${{ needs.package.outputs.archiveSha256 }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Require immutable final asset identity
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:ASSET_ARTIFACT_ID

      - name: Download final assets from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.ASSET_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-assets

      - name: Verify and restore final assets
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioReleaseAssets

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/studio-release/${{ needs.resolve.outputs.version }}/anywork-${{ needs.resolve.outputs.version }}-windows-x86_64-setup.exe

  linux-compile:
    name: Compile Linux amd64 checkpoint
    needs: [resolve, helper, linux-environment]
    if: needs.resolve.outputs.draft == 'true' && needs.resolve.outputs.linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bundleArtifactId: ${{ steps.bundle.outputs.artifact-id }}
      toolArtifactId: ${{ steps.tool.outputs.artifact-id }}
      bundleSha256: ${{ steps.checkpoint.outputs.bundleSha256 }}
      toolSha256: ${{ steps.checkpoint.outputs.toolSha256 }}
      toolWorkspace: ${{ steps.checkpoint.outputs.toolWorkspace }}
    env:
      CARGO_INCREMENTAL: "0"
      PURE_REMOTE_HELPER_PREBUILT_DIR: ${{ github.workspace }}/dist/remote-helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Require both helper producer identities
        env:
          HELPER_X64_ID: ${{ needs.helper.outputs.x64ArtifactId }}
          HELPER_ARM64_ID: ${{ needs.helper.outputs.arm64ArtifactId }}
        run: bash .github/scripts/studio-linux-handoff.sh artifact-ids "$HELPER_X64_ID" "$HELPER_ARM64_ID"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.helper.outputs.x64ArtifactId }}
          merge-multiple: true
          path: dist/remote-helper/x86_64-unknown-linux-musl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.helper.outputs.arm64ArtifactId }}
          merge-multiple: true
          path: dist/remote-helper/aarch64-unknown-linux-musl

      - name: Restore helper executable modes
        run: chmod +x dist/remote-helper/{x86_64,aarch64}-unknown-linux-musl/pl-remote-helper

      - name: Download same-run candidate environment
        if: needs.linux-environment.outputs.artifactId != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux-environment.outputs.artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-build-image
      - name: Verify exact environment identity
        env:
          LINUX_IMAGE_REF: ${{ needs.linux-environment.outputs.imageRef }}
          LINUX_IMAGE_ID: ${{ needs.linux-environment.outputs.imageId }}
          LINUX_IMAGE_ARTIFACT_ID: ${{ needs.linux-environment.outputs.artifactId }}
          LINUX_IMAGE_ARCHIVE_SHA256: ${{ needs.linux-environment.outputs.archiveSha256 }}
        run: bash .github/scripts/linux-build-handoff.sh

      - name: Build GUI with same-run prebuilt helpers
        run: bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" cargo xtask build-gui
      - name: Identify full bundle and prebuilt tool immediately
        id: checkpoint
        run: bash .github/scripts/studio-linux-handoff.sh checkpoint
      - name: Preserve complete Linux runtime checkpoint
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ needs.resolve.outputs.releaseId }}-linux-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-bundle.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve Linux release tool with executable mode
        id: tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ needs.resolve.outputs.releaseId }}-linux-tool-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-tool.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux-package:
    name: Package verified Linux prebuilt inputs
    needs: [resolve, linux-compile, linux-environment]
    if: needs.resolve.outputs.draft == 'true' && needs.resolve.outputs.linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifactId: ${{ steps.archive.outputs.artifact-id }}
      archiveSha256: ${{ steps.identity.outputs.archiveSha256 }}
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      BUNDLE_ARTIFACT_ID: ${{ needs.linux-compile.outputs.bundleArtifactId }}
      BUNDLE_SHA256: ${{ needs.linux-compile.outputs.bundleSha256 }}
      TOOL_ARTIFACT_ID: ${{ needs.linux-compile.outputs.toolArtifactId }}
      TOOL_SHA256: ${{ needs.linux-compile.outputs.toolSha256 }}
      TOOL_WORKSPACE: ${{ needs.linux-compile.outputs.toolWorkspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Require immutable prebuilt input IDs
        run: bash .github/scripts/studio-linux-handoff.sh artifact-ids "$BUNDLE_ARTIFACT_ID" "$TOOL_ARTIFACT_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.BUNDLE_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.TOOL_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-tool
      - name: Verify SHA-256 and exact compiled workspace identity
        run: bash .github/scripts/studio-linux-handoff.sh restore-inputs

      - name: Download same-run candidate environment
        if: needs.linux-environment.outputs.artifactId != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux-environment.outputs.artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-build-image
      - name: Verify exact environment identity
        env:
          LINUX_IMAGE_REF: ${{ needs.linux-environment.outputs.imageRef }}
          LINUX_IMAGE_ID: ${{ needs.linux-environment.outputs.imageId }}
          LINUX_IMAGE_ARTIFACT_ID: ${{ needs.linux-environment.outputs.artifactId }}
          LINUX_IMAGE_ARCHIVE_SHA256: ${{ needs.linux-environment.outputs.archiveSha256 }}
        run: bash .github/scripts/linux-build-handoff.sh

      # Direct prebuilt tool execution: no cargo/Flutter/helper compilation here.
      - name: Stage Debian package from verified bundle
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" \
            "$STUDIO_LINUX_TOOL" release-gui stage --version "$RELEASE_VERSION" --bundle "$STUDIO_LINUX_BUNDLE"
      - name: Verify Debian archive, layout, and exact checksum
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" \
            "$STUDIO_LINUX_TOOL" release-gui verify --version "$RELEASE_VERSION"
      - name: Identify final Linux asset archive
        id: identity
        run: bash .github/scripts/studio-linux-handoff.sh archive-assets
      - name: Preserve final Linux assets before online attestation
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-release-${{ needs.resolve.outputs.releaseId }}-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-assets.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux-attest:
    name: Attest archived Debian provenance
    needs: [resolve, linux-package]
    if: needs.resolve.outputs.draft == 'true' && needs.resolve.outputs.linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      ASSET_ARTIFACT_ID: ${{ needs.linux-package.outputs.artifactId }}
      ASSET_SHA256: ${{ needs.linux-package.outputs.archiveSha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Require immutable final asset ID
        run: bash .github/scripts/studio-linux-handoff.sh artifact-ids "$ASSET_ARTIFACT_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.ASSET_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-assets
      - name: Verify final archive and exact Debian sidecar
        run: bash .github/scripts/studio-linux-handoff.sh restore-assets
      - name: Attest Debian provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/studio-release/${{ needs.resolve.outputs.version }}/anywork-${{ needs.resolve.outputs.version }}-linux-x86_64.deb

  linux-compat:
    name: Debian compatibility (${{ matrix.runtime.name }})
    needs: [resolve, linux-package]
    if: needs.resolve.outputs.draft == 'true' && needs.resolve.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - {name: ubuntu-22.04, image: 'ubuntu:22.04'}
          - {name: ubuntu-24.04, image: 'ubuntu:24.04'}
          - {name: debian-12, image: 'debian:12-slim'}
          - {name: debian-13, image: 'debian:13-slim'}
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      ASSET_ARTIFACT_ID: ${{ needs.linux-package.outputs.artifactId }}
      ASSET_SHA256: ${{ needs.linux-package.outputs.archiveSha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Require immutable final asset ID
        run: bash .github/scripts/studio-linux-handoff.sh artifact-ids "$ASSET_ARTIFACT_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.ASSET_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-assets
      - name: Verify final archive and exact Debian sidecar
        run: bash .github/scripts/studio-linux-handoff.sh restore-assets
      - name: Install and load the same Debian package in a clean runtime
        env:
          RUNTIME_IMAGE: ${{ matrix.runtime.image }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/linux-compat-evidence"
          mkdir -p "$evidence"
          container="studio-linux-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker pull --platform linux/amd64 "$RUNTIME_IMAGE"
          docker image inspect "$RUNTIME_IMAGE" > "$evidence/runtime-image.json"
          docker run --rm --init --platform linux/amd64 --name "$container" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/dist/studio-release/$RELEASE_VERSION,dst=/packages,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/scripts/studio-linux-smoke.sh,dst=/smoke.sh,readonly" \
            --mount "type=bind,src=$evidence,dst=/evidence" \
            "$RUNTIME_IMAGE" bash /smoke.sh "/packages/anywork-$RELEASE_VERSION-linux-x86_64.deb" "$RELEASE_VERSION"
      - name: Preserve distribution loader and first-frame evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-linux-compat-${{ needs.resolve.outputs.releaseId }}-${{ matrix.runtime.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-compat-evidence
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Reconcile assets and publish draft
    needs: [resolve, compile, package, attest, linux-package, linux-compat, linux-attest]
    if: >-
      always() && !cancelled() && needs.resolve.outputs.draft == 'true' &&
      needs.compile.result == 'success' && needs.package.result == 'success' &&
      needs.attest.result == 'success' &&
      ((needs.resolve.outputs.linux == 'true' &&
        needs.linux-package.result == 'success' && needs.linux-compat.result == 'success' &&
        needs.linux-attest.result == 'success') ||
       (needs.resolve.outputs.linux == 'false' &&
        needs.linux-package.result == 'skipped' && needs.linux-compat.result == 'skipped' &&
        needs.linux-attest.result == 'skipped'))
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      TOOL_ARTIFACT_ID: ${{ needs.compile.outputs.toolArtifactId }}
      TOOL_SHA256: ${{ needs.compile.outputs.toolSha256 }}
      TOOL_WORKSPACE: ${{ needs.compile.outputs.toolWorkspace }}
      ASSET_ARTIFACT_ID: ${{ needs.package.outputs.artifactId }}
      ASSET_SHA256: ${{ needs.package.outputs.archiveSha256 }}
      LINUX_ASSET_ARTIFACT_ID: ${{ needs.linux-package.outputs.artifactId }}
      LINUX_ASSET_SHA256: ${{ needs.linux-package.outputs.archiveSha256 }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Require immutable release tool artifact ID
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:TOOL_ARTIFACT_ID

      - name: Download release tool from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.TOOL_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-tool

      - name: Verify and restore release tool
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioReleaseTool

      - name: Require immutable final asset identity
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:ASSET_ARTIFACT_ID

      - name: Download final assets from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.ASSET_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-assets

      - name: Verify and restore final assets
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioReleaseAssets

      - name: Verify final signed assets
        shell: pwsh
        run: |
          & $env:STUDIO_RELEASE_TOOL release-gui verify --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Release verification exited with $LASTEXITCODE" }

      - name: Require immutable Linux asset identity
        if: needs.resolve.outputs.linux == 'true'
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:LINUX_ASSET_ARTIFACT_ID

      - name: Download Linux final assets from this run
        if: needs.resolve.outputs.linux == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.LINUX_ASSET_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-assets

      # Windows verify above still sees exactly its original four files.
      - name: Verify Linux archive and combine final platform assets
        if: needs.resolve.outputs.linux == 'true'
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          . .github/scripts/studio-release-assets.ps1
          $archive = Join-Path $env:RUNNER_TEMP 'linux-assets/linux-assets.tar.gz'
          Assert-StudioSha256 -Path $archive -Expected $env:LINUX_ASSET_SHA256
          $name = "anywork-$env:RELEASE_VERSION-linux-x86_64.deb"
          $expected = @($name, "$name.sha256") | Sort-Object -CaseSensitive
          $entries = @(tar -tzf $archive)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Linux asset archive' }
          if ($entries.Count -ne 2 -or (Compare-Object -CaseSensitive $expected ($entries | Sort-Object -CaseSensitive))) {
            throw 'Linux archive does not contain exactly the two expected assets'
          }
          $linuxDir = Join-Path $env:RUNNER_TEMP 'linux-assets-restored'
          New-Item -ItemType Directory -Path $linuxDir | Out-Null
          tar -xzf $archive -C $linuxDir
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore Linux asset archive' }
          Assert-StudioDebianChecksum -Version $env:RELEASE_VERSION -AssetDirectory $linuxDir
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          foreach ($asset in $expected) {
            $destination = Join-Path $releaseDir $asset
            if (Test-Path -LiteralPath $destination) { throw "Refusing to overwrite $destination" }
            Move-Item -LiteralPath (Join-Path $linuxDir $asset) -Destination $destination
          }
          Assert-StudioDebianChecksum -Version $env:RELEASE_VERSION -AssetDirectory $releaseDir

      - name: Upload only missing identical assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read draft Release $env:RELEASE_ID"
          }
          if (
            [string]$release.id -cne $env:RELEASE_ID -or
            $release.url -cne "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -or
            $release.tag_name -cne $env:RELEASE_TAG -or
            $release.prerelease
          ) {
            throw "Release $env:RELEASE_ID changed identity before asset upload"
          }

          $plan = Get-StudioReleaseAssetPlan `
            -Release $release `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          foreach ($name in $plan.MissingNames) {
            if (-not [bool]$release.draft) {
              throw "Published Release $env:RELEASE_ID cannot receive missing asset $name"
            }
            $path = Join-Path $releaseDir $name
            $escapedName = [Uri]::EscapeDataString($name)
            $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$escapedName"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            Invoke-WebRequest `
              -Method Post `
              -Uri $uploadUrl `
              -Headers $headers `
              -ContentType 'application/octet-stream' `
              -InFile $path | Out-Null
            Write-Output "Uploaded missing Release asset $name"
          }

          $reconciled = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to re-read draft Release $env:RELEASE_ID"
          }
          $finalPlan = Get-StudioReleaseAssetPlan `
            -Release $reconciled `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $finalPlan.Complete) {
            throw "Release $env:RELEASE_ID is still missing assets: $($finalPlan.MissingNames -join ', ')"
          }

      - name: Publish complete Release as latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read Release $env:RELEASE_ID before publication"
          }
          if ($release.draft) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" `
              -F draft=false `
              -f make_latest=true *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish Release $env:RELEASE_ID"
            }
          }

          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or $published.prerelease -or $published.tag_name -cne $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_ID is not in the expected published state"
          }
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $plan = Get-StudioReleaseAssetPlan `
            -Release $published `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $plan.Complete) {
            throw "Published Release $env:RELEASE_ID failed final asset verification"
          }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$latest.id -cne $env:RELEASE_ID) {
            throw "Release $env:RELEASE_ID was not marked latest"
          }

  verify-existing:
    name: Verify already published Release
    needs: resolve
    if: needs.resolve.outputs.draft == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      # Verifying an already published Release has no upstream build in this run, so the
      # tool is built from the resolved immutable source. The cache stays limited to the
      # xtask target directory instead of restoring a whole GUI build tree, and keeps its
      # own cache domain because this job produces a different artifact set.
      - name: Cache verification tool build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          workspaces: |
            . -> target/xtask

      - name: Download and verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease -or $release.tag_name -cne $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_ID is not the expected published stable Release"
          }
          $expectedNames = @(Get-StudioReleaseAssetNames -Version $env:RELEASE_VERSION)
          Assert-StudioReleaseRemoteAssets -Release $release -ExpectedNames $expectedNames -RequireComplete

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          foreach ($asset in $release.assets) {
            if ($asset.browser_download_url -cne "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($asset.name)") {
              throw "Release asset $($asset.name) has an unexpected download URL"
            }
            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile (Join-Path $releaseDir $asset.name)
          }
          $plan = Get-StudioReleaseAssetPlan `
            -Release $release `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $plan.Complete) {
            throw "Published Release $env:RELEASE_ID is incomplete"
          }
          # Full remote/local reconciliation precedes platform-local verification.
          # Never broaden the strict Windows manifest's expected file set.
          $linuxNames = @($expectedNames | Where-Object { $_ -clike '*-linux-x86_64.deb*' })
          $linuxDir = Join-Path $env:RUNNER_TEMP 'published-linux-assets'
          if ($linuxNames.Count -ne 0) {
            Assert-StudioDebianChecksum -Version $env:RELEASE_VERSION -AssetDirectory $releaseDir
            New-Item -ItemType Directory -Path $linuxDir | Out-Null
            foreach ($name in $linuxNames) {
              Move-Item -LiteralPath (Join-Path $releaseDir $name) -Destination $linuxDir
            }
          }
          try {
            cargo xtask release-gui verify --version $env:RELEASE_VERSION
            if ($LASTEXITCODE -ne 0) { throw "Published Windows asset verification exited with $LASTEXITCODE" }
          } finally {
            foreach ($name in $linuxNames) {
              Move-Item -LiteralPath (Join-Path $linuxDir $name) -Destination $releaseDir
            }
          }
          if ($linuxNames.Count -ne 0) {
            Assert-StudioDebianChecksum -Version $env:RELEASE_VERSION -AssetDirectory $releaseDir
          }

          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$latest.id -cne $env:RELEASE_ID) {
            throw "Published Release $env:RELEASE_ID is not latest"
          }
