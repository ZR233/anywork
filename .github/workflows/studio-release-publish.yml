name: Studio Release Publish

on:
  workflow_call:
    inputs:
      releaseId:
        description: Exact GitHub Release ID created by Release Please
        required: true
        type: string
  workflow_dispatch:
    inputs:
      releaseId:
        description: Exact GitHub Release ID created by Release Please
        required: true
        type: string

concurrency:
  group: studio-stable-release-publish
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Resolve immutable Release source
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
      releaseId: ${{ steps.release.outputs.releaseId }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve Release ID, tag, version, and commit
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.releaseId }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw "Studio publisher must run from main, not $env:GITHUB_REF"
          }
          if ($env:GITHUB_REPOSITORY -cne 'ZR233/anywork') {
            throw "Studio publisher cannot run for repository $env:GITHUB_REPOSITORY"
          }
          if ($env:RELEASE_ID -notmatch '^[1-9]\d*$') {
            throw "Release ID must be a positive decimal integer: $env:RELEASE_ID"
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read GitHub Release $env:RELEASE_ID"
          }
          $expectedApiUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          $expectedUploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets{?name,label}"
          if (
            [string]$release.id -cne $env:RELEASE_ID -or
            $release.url -cne $expectedApiUrl -or
            $release.upload_url -cne $expectedUploadUrl
          ) {
            throw "Release $env:RELEASE_ID belongs to an unexpected repository or API resource"
          }
          if ($release.prerelease) {
            throw "Release $env:RELEASE_ID must not be a prerelease"
          }
          if ($release.tag_name -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Release tag must be stable v-prefixed SemVer: $($release.tag_name)"
          }
          $version = $Matches['version']
          $tag = "v$version"
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          Assert-StudioReleasePageUrl `
            -Release $release `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $tag

          git fetch --force origin `
            'refs/heads/main:refs/remotes/origin/main' `
            "refs/tags/${tag}:refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch main and immutable tag $tag"
          }
          $sha = (git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw "Failed to resolve commit for tag $tag"
          }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag commit $sha is not contained in origin/main"
          }
          if ($release.target_commitish -cne 'main' -and $release.target_commitish -cne $sha) {
            throw "Release target $($release.target_commitish) does not identify main or tag commit $sha"
          }

          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-superseded-releases.ps1')
          $superseded = Get-StudioSupersededReleases -WorkspaceRoot $env:GITHUB_WORKSPACE
          if ($release.draft -and $superseded.ContainsKey($tag)) {
            throw "Draft $tag has been superseded: $($superseded[$tag].reason). Prepare the next Release PR instead."
          }

          $rootVersion = (git show "${sha}:studio-version.txt").Trim()
          if ($LASTEXITCODE -ne 0 -or $rootVersion -cne $version) {
            throw "Tag $tag does not contain matching studio-version.txt"
          }
          $pubspec = git show "${sha}:code/anywork/pubspec.yaml"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag does not contain the Flutter pubspec"
          }
          $pubspecMatches = [regex]::Matches(
            ($pubspec -join "`n"),
            '(?m)^version:\s*(?<version>\S+)\s+#\s*x-release-please-version\s*$'
          )
          if ($pubspecMatches.Count -ne 1 -or $pubspecMatches[0].Groups['version'].Value -cne $version) {
            throw "Tag $tag does not contain the matching annotated Flutter version"
          }
          $manifest = (git show "${sha}:.release-please-manifest.json") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $manifest.'.' -cne $version) {
            throw "Tag $tag does not contain the matching Release Please manifest version"
          }

          $expectedNames = @(Get-StudioReleaseAssetNames -Version $version)
          Assert-StudioReleaseRemoteAssets `
            -Release $release `
            -ExpectedNames $expectedNames `
            -RequireComplete:(-not [bool]$release.draft)

          "draft=$($release.draft.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "releaseId=$env:RELEASE_ID" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  helper:
    name: Build Linux remote helper (${{ matrix.target }})
    outputs:
      x64ArtifactId: ${{ steps.helper-x64.outputs.artifact-id }}
      arm64ArtifactId: ${{ steps.helper-arm64.outputs.artifact-id }}
    needs: resolve
    if: needs.resolve.outputs.draft == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    permissions:
      contents: read
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Rust cross targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Set up cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
        with:
          version: 1.26.0

      - name: Install pinned Zig and cargo-zigbuild
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-0.16.0.tar.xz"
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$archive"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$archive" | sha256sum --check
          tool_dir="$RUNNER_TEMP/zig-0.16.0"
          mkdir -p "$tool_dir"
          tar -xJf "$archive" --strip-components=1 -C "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
          cargo binstall --no-confirm --force --disable-strategies compile cargo-zigbuild@0.23.4

      - name: Build remote helper architecture
        env:
          PURE_REMOTE_HELPER_BUILDER: zigbuild
        run: cargo xtask build-remote-helper --target ${{ matrix.target }}

      - name: Preserve x64 helper
        id: helper-x64
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-bundled-helper-${{ needs.resolve.outputs.releaseId }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: dist/remote-helper/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve arm64 helper
        id: helper-arm64
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-bundled-helper-${{ needs.resolve.outputs.releaseId }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: dist/remote-helper/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  compile:
    name: Compile Windows x64 checkpoint
    needs:
      - resolve
      - helper
    if: needs.resolve.outputs.draft == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifactId: ${{ steps.archive.outputs.artifact-id }}
      archiveSha256: ${{ steps.identity.outputs.archiveSha256 }}
      toolSha256: ${{ steps.identity.outputs.toolSha256 }}
      toolWorkspace: ${{ steps.identity.outputs.toolWorkspace }}
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      PURE_REMOTE_HELPER_PREBUILT_DIR: ${{ github.workspace }}/dist/remote-helper
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Require both helper producer identities
        shell: pwsh
        env:
          HELPER_X64_ID: ${{ needs.helper.outputs.x64ArtifactId }}
          HELPER_ARM64_ID: ${{ needs.helper.outputs.arm64ArtifactId }}
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:HELPER_X64_ID
          Assert-StudioArtifactId -Id $env:HELPER_ARM64_ID

      - name: Download helper bundle inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.helper.outputs.x64ArtifactId }}
          merge-multiple: true
          path: dist/remote-helper/x86_64-unknown-linux-musl

      - name: Download ARM64 helper bundle inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.helper.outputs.arm64ArtifactId }}
          merge-multiple: true
          path: dist/remote-helper/aarch64-unknown-linux-musl

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          # Same Windows GUI product set as the RC workflow.
          shared-key: gui-windows
          workspaces: |
            . -> target
            . -> target/xtask

      - name: Build GUI bundle and release tool
        run: cargo xtask build-gui

      - name: Archive compiled bundle, matching symbols, and tool identity
        id: identity
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          New-StudioCompileArchive

      - name: Preserve compiled checkpoint immediately
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ needs.resolve.outputs.releaseId }}-compile-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compile.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve matching debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ needs.resolve.outputs.releaseId }}-symbols-${{ github.run_attempt }}
          path: ${{ runner.temp }}/symbols.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  package:
    name: Package, sign, and smoke-test Windows x64
    needs: [resolve, compile]
    if: needs.resolve.outputs.draft == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifactId: ${{ steps.archive.outputs.artifact-id }}
      archiveSha256: ${{ steps.identity.outputs.archiveSha256 }}
      installerSha256: ${{ steps.identity.outputs.installerSha256 }}
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      COMPILE_ARTIFACT_ID: ${{ needs.compile.outputs.artifactId }}
      COMPILE_SHA256: ${{ needs.compile.outputs.archiveSha256 }}
      TOOL_SHA256: ${{ needs.compile.outputs.toolSha256 }}
      TOOL_WORKSPACE: ${{ needs.compile.outputs.toolWorkspace }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Require immutable compile artifact identity
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:COMPILE_ARTIFACT_ID

      - name: Download compiled checkpoint from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.COMPILE_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-compile

      - name: Verify and restore compiled checkpoint
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioCompileArchive

      - name: Install pinned release packaging tools
        shell: pwsh
        run: |
          . .github/scripts/studio-package-tools.ps1
          Install-StudioInnoSetup
          Install-StudioMinisign

      - name: Materialize optional Authenticode certificate
        shell: pwsh
        env:
          AUTHENTICODE_CERTIFICATE_BASE64: ${{ secrets.AUTHENTICODE_CERTIFICATE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_CERTIFICATE_BASE64)) {
            $certificate = Join-Path $env:RUNNER_TEMP 'anywork-authenticode.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:AUTHENTICODE_CERTIFICATE_BASE64))
            "WINDOWS_CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signTool) { throw 'signtool.exe not found' }
            "WINDOWS_SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Stage installer from verified prebuilt bundle
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.AUTHENTICODE_CERTIFICATE_PASSWORD }}
        run: |
          & $env:STUDIO_RELEASE_TOOL release-gui stage --version $env:RELEASE_VERSION --bundle $env:STUDIO_RELEASE_BUNDLE
          if ($LASTEXITCODE -ne 0) { throw "Package staging exited with $LASTEXITCODE" }

      - name: Remove Authenticode certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH) -and (Test-Path -LiteralPath $env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_PATH -Force
          }

      - name: Materialize Minisign credentials
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MINISIGN_SECRET_KEY)) {
            throw 'MINISIGN_SECRET_KEY secret is required'
          }
          if ([string]::IsNullOrWhiteSpace($env:MINISIGN_PASSWORD)) {
            throw 'MINISIGN_PASSWORD secret is required'
          }
          $minisignKey = Join-Path $env:RUNNER_TEMP 'anywork.key'
          Set-Content -LiteralPath $minisignKey -Value $env:MINISIGN_SECRET_KEY -NoNewline
          "MINISIGN_SECRET_KEY_FILE=$minisignKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Finalize and verify signed release
        shell: pwsh
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          & $env:STUDIO_RELEASE_TOOL release-gui finalize --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Release finalization exited with $LASTEXITCODE" }

      - name: Remove Minisign secret key
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MINISIGN_SECRET_KEY_FILE) -and (Test-Path -LiteralPath $env:MINISIGN_SECRET_KEY_FILE)) {
            Remove-Item -LiteralPath $env:MINISIGN_SECRET_KEY_FILE -Force
          }

      - name: Smoke-test per-user installer
        shell: pwsh
        run: |
          . .github/scripts/studio-package-tools.ps1
          Test-StudioInstaller

      - name: Verify final signed assets
        shell: pwsh
        run: |
          & $env:STUDIO_RELEASE_TOOL release-gui verify --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Release verification exited with $LASTEXITCODE" }

      - name: Identify final asset archive and installer
        id: identity
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $installer = Join-Path $releaseDir "anywork-$env:RELEASE_VERSION-windows-x86_64-setup.exe"
          $archive = Join-Path $env:RUNNER_TEMP 'assets.zip'
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $archive
          "archiveSha256=$((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installerSha256=$((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preserve final assets before online attestation
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-release-${{ needs.resolve.outputs.releaseId }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attest:
    name: Attest archived installer provenance
    needs: [resolve, package]
    if: needs.resolve.outputs.draft == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      ASSET_ARTIFACT_ID: ${{ needs.package.outputs.artifactId }}
      ASSET_SHA256: ${{ needs.package.outputs.archiveSha256 }}
      INSTALLER_SHA256: ${{ needs.package.outputs.installerSha256 }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Require immutable final asset identity
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:ASSET_ARTIFACT_ID

      - name: Download final assets from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.ASSET_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-assets

      - name: Verify and restore final assets
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioReleaseAssets

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/studio-release/${{ needs.resolve.outputs.version }}/anywork-${{ needs.resolve.outputs.version }}-windows-x86_64-setup.exe

  publish:
    name: Reconcile assets and publish draft
    needs: [resolve, compile, package, attest]
    if: needs.resolve.outputs.draft == 'true' && needs.attest.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      COMPILE_ARTIFACT_ID: ${{ needs.compile.outputs.artifactId }}
      COMPILE_SHA256: ${{ needs.compile.outputs.archiveSha256 }}
      TOOL_SHA256: ${{ needs.compile.outputs.toolSha256 }}
      TOOL_WORKSPACE: ${{ needs.compile.outputs.toolWorkspace }}
      ASSET_ARTIFACT_ID: ${{ needs.package.outputs.artifactId }}
      ASSET_SHA256: ${{ needs.package.outputs.archiveSha256 }}
      INSTALLER_SHA256: ${{ needs.package.outputs.installerSha256 }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Require immutable compile artifact identity
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:COMPILE_ARTIFACT_ID

      - name: Download compiled checkpoint from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.COMPILE_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-compile

      - name: Verify and restore compiled checkpoint
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioCompileArchive

      - name: Require immutable final asset identity
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Assert-StudioArtifactId -Id $env:ASSET_ARTIFACT_ID

      - name: Download final assets from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.ASSET_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/studio-assets

      - name: Verify and restore final assets
        shell: pwsh
        run: |
          . .github/scripts/studio-compile-handoff.ps1
          Restore-StudioReleaseAssets

      - name: Verify final signed assets
        shell: pwsh
        run: |
          & $env:STUDIO_RELEASE_TOOL release-gui verify --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Release verification exited with $LASTEXITCODE" }

      - name: Upload only missing identical assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read draft Release $env:RELEASE_ID"
          }
          if (
            [string]$release.id -cne $env:RELEASE_ID -or
            $release.url -cne "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -or
            $release.tag_name -cne $env:RELEASE_TAG -or
            $release.prerelease
          ) {
            throw "Release $env:RELEASE_ID changed identity before asset upload"
          }

          $plan = Get-StudioReleaseAssetPlan `
            -Release $release `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          foreach ($name in $plan.MissingNames) {
            if (-not [bool]$release.draft) {
              throw "Published Release $env:RELEASE_ID cannot receive missing asset $name"
            }
            $path = Join-Path $releaseDir $name
            $escapedName = [Uri]::EscapeDataString($name)
            $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$escapedName"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            Invoke-WebRequest `
              -Method Post `
              -Uri $uploadUrl `
              -Headers $headers `
              -ContentType 'application/octet-stream' `
              -InFile $path | Out-Null
            Write-Output "Uploaded missing Release asset $name"
          }

          $reconciled = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to re-read draft Release $env:RELEASE_ID"
          }
          $finalPlan = Get-StudioReleaseAssetPlan `
            -Release $reconciled `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $finalPlan.Complete) {
            throw "Release $env:RELEASE_ID is still missing assets: $($finalPlan.MissingNames -join ', ')"
          }

      - name: Publish complete Release as latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read Release $env:RELEASE_ID before publication"
          }
          if ($release.draft) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" `
              -F draft=false `
              -f make_latest=true *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish Release $env:RELEASE_ID"
            }
          }

          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or $published.prerelease -or $published.tag_name -cne $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_ID is not in the expected published state"
          }
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          $plan = Get-StudioReleaseAssetPlan `
            -Release $published `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $plan.Complete) {
            throw "Published Release $env:RELEASE_ID failed final asset verification"
          }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$latest.id -cne $env:RELEASE_ID) {
            throw "Release $env:RELEASE_ID was not marked latest"
          }

  verify-existing:
    name: Verify already published Release
    needs: resolve
    if: needs.resolve.outputs.draft == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.releaseId }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      # Verifying an already published Release has no upstream build in this run, so the
      # tool is built from the resolved immutable source. The cache stays limited to the
      # xtask target directory instead of restoring a whole GUI build tree, and keeps its
      # own cache domain because this job produces a different artifact set.
      - name: Cache verification tool build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          workspaces: |
            . -> target/xtask

      - name: Download and verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-release-assets.ps1')
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease -or $release.tag_name -cne $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_ID is not the expected published stable Release"
          }
          $expectedNames = @(Get-StudioReleaseAssetNames -Version $env:RELEASE_VERSION)
          Assert-StudioReleaseRemoteAssets -Release $release -ExpectedNames $expectedNames -RequireComplete

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist/studio-release/$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          foreach ($asset in $release.assets) {
            if ($asset.browser_download_url -cne "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($asset.name)") {
              throw "Release asset $($asset.name) has an unexpected download URL"
            }
            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile (Join-Path $releaseDir $asset.name)
          }
          $plan = Get-StudioReleaseAssetPlan `
            -Release $release `
            -Version $env:RELEASE_VERSION `
            -AssetDirectory $releaseDir
          if (-not $plan.Complete) {
            throw "Published Release $env:RELEASE_ID is incomplete"
          }
          cargo xtask release-gui verify --version $env:RELEASE_VERSION

          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$latest.id -cne $env:RELEASE_ID) {
            throw "Published Release $env:RELEASE_ID is not latest"
          }
