name: macOS Release Build

on:
  workflow_call:
    inputs:
      sourceSha:
        required: true
        type: string
      helperX64Id:
        required: true
        type: string
      helperArm64Id:
        required: true
        type: string
      artifactPrefix:
        required: true
        type: string
    outputs:
      artifactId:
        value: ${{ jobs.package.outputs.artifactId }}
      archiveSha256:
        value: ${{ jobs.package.outputs.archiveSha256 }}

permissions:
  contents: read

jobs:
  compile:
    name: Compile macOS arm64 checkpoint
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundleArtifactId: ${{ steps.bundle.outputs.artifact-id }}
      toolArtifactId: ${{ steps.tool.outputs.artifact-id }}
      bundleSha256: ${{ steps.checkpoint.outputs.bundleSha256 }}
      toolSha256: ${{ steps.checkpoint.outputs.toolSha256 }}
      toolWorkspace: ${{ steps.checkpoint.outputs.toolWorkspace }}
    env:
      PURE_REMOTE_HELPER_PREBUILT_DIR: ${{ github.workspace }}/dist/remote-helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sourceSha }}
          persist-credentials: false
      - name: Require both helper producer identities
        env:
          HELPER_X64_ID: ${{ inputs.helperX64Id }}
          HELPER_ARM64_ID: ${{ inputs.helperArm64Id }}
        run: bash .github/scripts/studio-macos-handoff.sh artifact-ids "$HELPER_X64_ID" "$HELPER_ARM64_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.helperX64Id }}
          merge-multiple: true
          path: dist/remote-helper/x86_64-unknown-linux-musl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.helperArm64Id }}
          merge-multiple: true
          path: dist/remote-helper/aarch64-unknown-linux-musl
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          cache: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
      - name: Read stable package version
        id: version
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(cat studio-version.txt)
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build native GUI bundle and release tool
        run: cargo xtask build-gui
      - name: Archive runtime bundle and release tool
        id: checkpoint
        run: bash .github/scripts/studio-macos-handoff.sh checkpoint
      - name: Preserve runtime checkpoint immediately
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-macos-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-bundle.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve independent release tool
        id: tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-macos-tool-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-tool.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package:
    name: Package verified macOS arm64 bundle
    needs: compile
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      artifactId: ${{ steps.assets.outputs.artifact-id }}
      archiveSha256: ${{ steps.archive.outputs.archiveSha256 }}
    env:
      RELEASE_VERSION: ${{ needs.compile.outputs.version }}
      BUNDLE_ARTIFACT_ID: ${{ needs.compile.outputs.bundleArtifactId }}
      BUNDLE_SHA256: ${{ needs.compile.outputs.bundleSha256 }}
      TOOL_ARTIFACT_ID: ${{ needs.compile.outputs.toolArtifactId }}
      TOOL_SHA256: ${{ needs.compile.outputs.toolSha256 }}
      TOOL_WORKSPACE: ${{ needs.compile.outputs.toolWorkspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sourceSha }}
          persist-credentials: false
      - name: Require immutable input identities
        run: bash .github/scripts/studio-macos-handoff.sh artifact-ids "$BUNDLE_ARTIFACT_ID" "$TOOL_ARTIFACT_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.BUNDLE_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/macos-bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.TOOL_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/macos-tool
      - name: Verify and restore prebuilt inputs
        run: bash .github/scripts/studio-macos-handoff.sh restore-inputs
      - name: Package without rebuilding or modifying signed app
        run: |
          "$STUDIO_MACOS_TOOL" release-gui stage --version "$RELEASE_VERSION" --bundle "$STUDIO_MACOS_BUNDLE"
          "$STUDIO_MACOS_TOOL" release-gui verify --version "$RELEASE_VERSION"
      - name: Archive final macOS assets
        id: archive
        run: bash .github/scripts/studio-macos-handoff.sh archive-assets
      - name: Preserve verified final assets
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-macos-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-assets.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
