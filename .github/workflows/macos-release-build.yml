name: macOS Release Build

on:
  workflow_call:
    inputs:
      sourceSha:
        required: true
        type: string
      helperX64Id:
        required: true
        type: string
      helperArm64Id:
        required: true
        type: string
      artifactPrefix:
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.compile.outputs.version }}
      bundleArtifactId:
        value: ${{ jobs.compile.outputs.bundleArtifactId }}
      bundleSha256:
        value: ${{ jobs.compile.outputs.bundleSha256 }}
      toolArtifactId:
        value: ${{ jobs.compile.outputs.toolArtifactId }}
      toolSha256:
        value: ${{ jobs.compile.outputs.toolSha256 }}
      toolWorkspace:
        value: ${{ jobs.compile.outputs.toolWorkspace }}

permissions:
  contents: read

jobs:
  compile:
    name: Compile macOS arm64 checkpoint
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundleArtifactId: ${{ steps.bundle.outputs.artifact-id }}
      toolArtifactId: ${{ steps.tool.outputs.artifact-id }}
      bundleSha256: ${{ steps.checkpoint.outputs.bundleSha256 }}
      toolSha256: ${{ steps.checkpoint.outputs.toolSha256 }}
      toolWorkspace: ${{ steps.checkpoint.outputs.toolWorkspace }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PURE_REMOTE_HELPER_PREBUILT_DIR: ${{ github.workspace }}/dist/remote-helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sourceSha }}
          persist-credentials: false
      - name: Require both helper producer identities
        env:
          HELPER_X64_ID: ${{ inputs.helperX64Id }}
          HELPER_ARM64_ID: ${{ inputs.helperArm64Id }}
        run: bash .github/scripts/studio-macos-handoff.sh artifact-ids "$HELPER_X64_ID" "$HELPER_ARM64_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.helperX64Id }}
          merge-multiple: true
          path: dist/remote-helper/x86_64-unknown-linux-musl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.helperArm64Id }}
          merge-multiple: true
          path: dist/remote-helper/aarch64-unknown-linux-musl
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.0
          cache: true
      - name: Set up cached native Rust build
        uses: ./.github/actions/setup-studio-rust
      - name: Read stable package version
        id: version
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(cat studio-version.txt)
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build native GUI bundle and release tool
        run: cargo xtask build-gui --without-anywk
      - name: Archive runtime bundle and release tool
        id: checkpoint
        run: bash .github/scripts/studio-macos-handoff.sh checkpoint
      - name: Preserve runtime checkpoint immediately
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifactPrefix }}-macos-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-bundle.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve independent release tool
        id: tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifactPrefix }}-macos-tool-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-tool.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
