name: macOS Release Package

on:
  workflow_call:
    inputs:
      sourceSha:
        required: true
        type: string
      version:
        required: true
        type: string
      bundleArtifactId:
        required: true
        type: string
      bundleSha256:
        required: true
        type: string
      toolArtifactId:
        required: true
        type: string
      toolSha256:
        required: true
        type: string
      toolWorkspace:
        required: true
        type: string
      anywkArtifactId:
        required: true
        type: string
      anywkArchiveSha256:
        required: true
        type: string
      artifactPrefix:
        required: true
        type: string
      verifyPackage:
        required: false
        type: boolean
        default: true
    outputs:
      artifactId:
        value: ${{ jobs.package.outputs.artifactId }}
      archiveSha256:
        value: ${{ jobs.package.outputs.archiveSha256 }}

permissions:
  contents: read

jobs:
  package:
    name: Package verified macOS arm64 bundle
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      artifactId: ${{ steps.assets.outputs.artifact-id }}
      archiveSha256: ${{ steps.archive.outputs.archiveSha256 }}
    env:
      SOURCE_SHA: ${{ inputs.sourceSha }}
      RELEASE_VERSION: ${{ inputs.version }}
      BUNDLE_ARTIFACT_ID: ${{ inputs.bundleArtifactId }}
      BUNDLE_SHA256: ${{ inputs.bundleSha256 }}
      TOOL_ARTIFACT_ID: ${{ inputs.toolArtifactId }}
      TOOL_SHA256: ${{ inputs.toolSha256 }}
      TOOL_WORKSPACE: ${{ inputs.toolWorkspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sourceSha }}
          persist-credentials: false
      - name: Require immutable input identities
        run: bash .github/scripts/studio-macos-handoff.sh artifact-ids "$BUNDLE_ARTIFACT_ID" "$TOOL_ARTIFACT_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.BUNDLE_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/macos-bundle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.TOOL_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/macos-tool
      - name: Verify and restore prebuilt inputs
        run: bash .github/scripts/studio-macos-handoff.sh restore-inputs
      - name: Restore verified anywk checkpoint
        uses: ./.github/actions/restore-studio-anywk
        with:
          artifact-id: ${{ inputs.anywkArtifactId }}
          archive-sha256: ${{ inputs.anywkArchiveSha256 }}
      - name: Assemble GUI and re-sign the outer app
        run: |
          "$STUDIO_MACOS_TOOL" assemble-gui --bundle "$STUDIO_MACOS_BUNDLE" \
            --anywk dist/studio-anywk --source-sha "$SOURCE_SHA"
      - name: Package the assembled app
        run: '"$STUDIO_MACOS_TOOL" release-gui stage --version "$RELEASE_VERSION" --bundle "$STUDIO_MACOS_BUNDLE"'
      - name: Verify packaged app
        if: inputs.verifyPackage
        run: '"$STUDIO_MACOS_TOOL" release-gui verify --version "$RELEASE_VERSION"'
      - name: Archive final macOS assets
        id: archive
        run: bash .github/scripts/studio-macos-handoff.sh archive-assets
      - name: Preserve verified final assets
        id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifactPrefix }}-macos-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-assets.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
