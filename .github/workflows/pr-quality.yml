name: PR Quality Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions: {}

# A newer commit on the same pull request cancels its superseded run. Branch pushes use
# their own run id instead, so a queued run is never replaced by a newer one.
concurrency:
  group: pr-quality-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_policy: ${{ steps.plan.outputs.docs_policy }}
      release_configuration: ${{ steps.plan.outputs.release_configuration }}
      rust_quality: ${{ steps.plan.outputs.rust_quality }}
      rust_deterministic: ${{ steps.plan.outputs.rust_deterministic }}
      linux_environment: ${{ steps.plan.outputs.linux_environment }}
      flutter_quality: ${{ steps.plan.outputs.flutter_quality }}
      flutter_ui: ${{ steps.plan.outputs.flutter_ui }}
      linux_desktop: ${{ steps.plan.outputs.linux_desktop }}
      windows_desktop: ${{ steps.plan.outputs.windows_desktop }}
      macos_desktop: ${{ steps.plan.outputs.macos_desktop }}
      linux_native: ${{ steps.plan.outputs.linux_native }}
      windows_native: ${{ steps.plan.outputs.windows_native }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
      plan: ${{ steps.plan.outputs.plan }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove path classification and gate rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_pr_quality_*.py' -v

      - name: Classify applicable jobs from Git paths
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/pr_quality_changes.py

  docs-policy:
    name: docs-policy
    needs: changes
    if: needs.changes.outputs.docs_policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check design index and local documentation links
        run: python3 .github/scripts/pr_quality_docs_policy.py

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test
          requireScope: false

  release-configuration:
    name: Release configuration
    needs: changes
    if: needs.changes.outputs.release_configuration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate superseded Release policy against immutable tags
        shell: pwsh
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-superseded-releases.ps1')
          $superseded = Get-StudioSupersededReleases -WorkspaceRoot $env:GITHUB_WORKSPACE
          Write-Host "Validated $($superseded.Count) superseded Studio Releases"

      - name: Test release reconciliation and platform checksum boundaries
        shell: pwsh
        run: ./.github/scripts/studio-release-assets.tests.ps1

      - name: Validate workflows with actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: local

      - name: Validate Release Please configuration and dry run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_BRANCH: ${{ github.head_ref || github.ref_name }}
          VALIDATION_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -o pipefail
          python3 -m json.tool release-please-config.json > /dev/null
          python3 -m json.tool .release-please-manifest.json > /dev/null

          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          for attempt in 1 2 3; do
            if npx --yes release-please@17.10.4 release-pr \
              --dry-run \
              --repo-url="$VALIDATION_REPOSITORY" \
              --target-branch="$VALIDATION_BRANCH" \
              --config-file=release-please-config.json \
              --manifest-file=.release-please-manifest.json \
              --token="$GH_TOKEN" 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if ! grep -Fq 'GraphqlResponseError:' "$log_file"; then
              exit 1
            fi
            if ! grep -Fq 'Something went wrong while executing your query' "$log_file" \
              && ! grep -Fq "We couldn't respond to your request in time" "$log_file"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

  rust-quality:
    name: Rust (Windows)
    needs: changes
    if: needs.changes.outputs.rust_quality == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Check standalone core without database features
        run: cargo check --locked -p pl-core --no-default-features --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # TOML schema admission and credential/file commit recovery also depend on the
      # Windows atomic replacement boundary; Linux-only Studio tests are not sufficient.
      - name: Test Studio migrations and recovery on Windows
        run: cargo test --locked -p pl-studio-runtime --lib

  rust-deterministic:
    name: rust-deterministic
    needs:
      - changes
      - linux-environment
    if: needs.changes.outputs.rust_deterministic == 'true' && needs.linux-environment.result == 'success'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download same-run candidate environment
        if: needs.linux-environment.outputs.artifactId != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux-environment.outputs.artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-build-image

      - name: Verify exact environment identity
        env:
          LINUX_IMAGE_REF: ${{ needs.linux-environment.outputs.imageRef }}
          LINUX_IMAGE_ID: ${{ needs.linux-environment.outputs.imageId }}
          LINUX_IMAGE_ARTIFACT_ID: ${{ needs.linux-environment.outputs.artifactId }}
          LINUX_IMAGE_ARCHIVE_SHA256: ${{ needs.linux-environment.outputs.archiveSha256 }}
        run: bash .github/scripts/linux-build-handoff.sh

      - name: Test workspace with locked SQLite profile
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            cargo install --path code/pl-remote-helper --locked --debug --target-dir "$PWD/target" --root "$PWD/target/local-worker"
            export PATH="$PWD/target/local-worker/bin:$PATH"
            cargo test --locked --workspace --features pl-core/sqlite
          '

  linux-environment:
    name: Prepare exact Linux build environment
    needs: changes
    if: needs.changes.outputs.linux_environment == 'true'
    uses: ./.github/workflows/linux-build-environment.yml
    permissions:
      contents: read
    with:
      sourceRef: ${{ github.sha }}
      mode: prepare

  studio-server-linux:
    name: Studio server (Linux)
    needs:
      - changes
      - linux-environment
    if: needs.changes.outputs.linux_environment == 'true' && needs.linux-environment.result == 'success'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download same-run candidate environment
        if: needs.linux-environment.outputs.artifactId != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux-environment.outputs.artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-build-image

      - name: Verify exact environment identity
        env:
          LINUX_IMAGE_REF: ${{ needs.linux-environment.outputs.imageRef }}
          LINUX_IMAGE_ID: ${{ needs.linux-environment.outputs.imageId }}
          LINUX_IMAGE_ARTIFACT_ID: ${{ needs.linux-environment.outputs.artifactId }}
          LINUX_IMAGE_ARCHIVE_SHA256: ${{ needs.linux-environment.outputs.archiveSha256 }}
        run: bash .github/scripts/linux-build-handoff.sh

      - name: Build server in the matching Linux environment
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            cargo build -p pl-studio-server
          '

  flutter-quality:
    name: Flutter
    needs: changes
    if: needs.changes.outputs.flutter_quality == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          workspaces: |
            . -> target
            . -> target/xtask

      - name: Set up cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
        with:
          version: 1.26.0

      # FRB otherwise installs cargo-expand from source during generation.
      - name: Install prebuilt FRB tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --force --disable-strategies compile flutter_rust_bridge_codegen@2.13.0 cargo-expand@1.0.127

      # 确定性 Client/adapter 与 GUI 静态门禁。原生 Driver/live 人工验收
      # 按实际宿主平台单独记录（见 AGENTS.md），不由此推断跨平台通过。
      - name: Verify Dart Client and adapter contracts
        run: cargo xtask verify-client

      - name: Verify Flutter application
        run: cargo xtask verify-gui

  flutter-ui:
    name: flutter-ui
    needs: changes
    if: needs.changes.outputs.flutter_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install application packages from the lockfile
        working-directory: code/anywork
        run: flutter pub get --enforce-lockfile

      - name: Run UI widget tests without a device or Rust bridge
        working-directory: code/anywork
        run: flutter test --no-pub test/ui

  linux-desktop:
    name: linux-desktop
    needs:
      - changes
      - linux-environment
    if: needs.changes.outputs.linux_desktop == 'true' && needs.linux-environment.result == 'success'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download same-run candidate environment
        if: needs.linux-environment.outputs.artifactId != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux-environment.outputs.artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-build-image

      - name: Verify exact environment identity
        env:
          LINUX_IMAGE_REF: ${{ needs.linux-environment.outputs.imageRef }}
          LINUX_IMAGE_ID: ${{ needs.linux-environment.outputs.imageId }}
          LINUX_IMAGE_ARTIFACT_ID: ${{ needs.linux-environment.outputs.artifactId }}
          LINUX_IMAGE_ARCHIVE_SHA256: ${{ needs.linux-environment.outputs.archiveSha256 }}
        run: bash .github/scripts/linux-build-handoff.sh

      - name: Run desktop functional full on Xvfb
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
              cargo xtask test-project --suite desktop --set full --output target/ci-desktop-linux
          '

  windows-desktop:
    name: windows-desktop
    needs: changes
    if: needs.changes.outputs.windows_desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Run desktop smoke
        run: cargo xtask test-project --suite desktop --set smoke --output target/ci-desktop-windows

  linux-native:
    name: linux-native
    needs:
      - changes
      - linux-environment
    if: needs.changes.outputs.linux_native == 'true' && needs.linux-environment.result == 'success'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download same-run candidate environment
        if: needs.linux-environment.outputs.artifactId != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux-environment.outputs.artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-build-image

      - name: Verify exact environment identity
        env:
          LINUX_IMAGE_REF: ${{ needs.linux-environment.outputs.imageRef }}
          LINUX_IMAGE_ID: ${{ needs.linux-environment.outputs.imageId }}
          LINUX_IMAGE_ARTIFACT_ID: ${{ needs.linux-environment.outputs.artifactId }}
          LINUX_IMAGE_ARCHIVE_SHA256: ${{ needs.linux-environment.outputs.archiveSha256 }}
        run: bash .github/scripts/linux-build-handoff.sh

      - name: Run native lifecycle full on Xvfb
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
              cargo xtask test-project --suite native --set full --output target/ci-native-linux
          '

  windows-native:
    name: windows-native
    needs: changes
    if: needs.changes.outputs.windows_native == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Run native lifecycle full
        run: cargo xtask test-project --suite native --set full --output target/ci-native-windows

  macos-desktop:
    name: macOS desktop
    needs: changes
    if: needs.changes.outputs.macos_desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Set up existing remote helper cross compiler
        run: |
          brew install zig
          cargo install cargo-zigbuild --version 0.24.0 --locked

      - name: Test native process ownership and bundle collection
        run: cargo test --locked -p pl-dev-support -p pl-xtask

      - name: Build native macOS application
        run: cargo xtask build-gui

      - name: Test AppKit asynchronous termination and exit codes
        run: python3 .github/scripts/studio-macos-termination-tests.py dist/anywork-release/anywork.app

      - name: Verify macOS archive, version, architecture and signatures
        run: |
          version=$(cat studio-version.txt)
          cargo xtask release-gui stage --version "$version" --bundle dist/anywork-release
          cargo xtask release-gui verify --version "$version"

      - name: Test macOS terminal command quoting
        run: cargo flutter test --no-pub test/platform/macos_terminal_test.dart

      - name: Run desktop smoke
        run: cargo xtask test-project --suite desktop --set smoke --output target/ci-desktop-macos

  # Suggested repository required check name: ci-gate. This job always emits a
  # result; editing the workflow does not itself configure branch protection.
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - changes
      - docs-policy
      - pr-title
      - release-configuration
      - rust-quality
      - rust-deterministic
      - linux-environment
      - studio-server-linux
      - flutter-quality
      - flutter-ui
      - linux-desktop
      - windows-desktop
      - macos-desktop
      - linux-native
      - windows-native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify required jobs against the changes plan
        env:
          REQUIRED_JOBS: ${{ needs.changes.outputs.required_jobs }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_POLICY_RESULT: ${{ needs.docs-policy.result }}
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
          RELEASE_CONFIGURATION_RESULT: ${{ needs.release-configuration.result }}
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
          RUST_DETERMINISTIC_RESULT: ${{ needs.rust-deterministic.result }}
          LINUX_ENVIRONMENT_RESULT: ${{ needs.linux-environment.result }}
          STUDIO_SERVER_LINUX_RESULT: ${{ needs.studio-server-linux.result }}
          FLUTTER_QUALITY_RESULT: ${{ needs.flutter-quality.result }}
          FLUTTER_UI_RESULT: ${{ needs.flutter-ui.result }}
          LINUX_DESKTOP_RESULT: ${{ needs.linux-desktop.result }}
          WINDOWS_DESKTOP_RESULT: ${{ needs.windows-desktop.result }}
          MACOS_DESKTOP_RESULT: ${{ needs.macos-desktop.result }}
          LINUX_NATIVE_RESULT: ${{ needs.linux-native.result }}
