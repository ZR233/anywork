name: PR Quality Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions: {}

# A newer commit on the same pull request cancels its superseded run. Branch pushes use
# their own run id instead, so a queued run is never replaced by a newer one.
concurrency:
  group: pr-quality-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_policy: ${{ steps.plan.outputs.docs_policy }}
      release_configuration: ${{ steps.plan.outputs.release_configuration }}
      rust_checks: ${{ steps.plan.outputs.rust_checks }}
      linux_environment: ${{ steps.plan.outputs.linux_environment }}
      client_checks: ${{ steps.plan.outputs.client_checks }}
      flutter_checks: ${{ steps.plan.outputs.flutter_checks }}
      gui_generated: ${{ steps.plan.outputs.gui_generated }}
      linux_inputs: ${{ steps.plan.outputs.linux_inputs }}
      remote_helpers: ${{ steps.plan.outputs.remote_helpers }}
      linux_desktop: ${{ steps.plan.outputs.linux_desktop }}
      linux_native: ${{ steps.plan.outputs.linux_native }}
      windows_build: ${{ steps.plan.outputs.windows_build }}
      macos_build: ${{ steps.plan.outputs.macos_build }}
      windows_gui_build: ${{ steps.plan.outputs.windows_gui_build }}
      macos_gui_build: ${{ steps.plan.outputs.macos_gui_build }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
      plan: ${{ steps.plan.outputs.plan }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove path classification and gate rules
        env:
          PR_HANDOFF_TEST_SCRATCH: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/scripts -p 'test_pr_quality_*.py' -v

      - name: Classify applicable jobs from Git paths
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/pr_quality_changes.py

  docs-policy:
    name: docs-policy
    needs: changes
    if: needs.changes.outputs.docs_policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check design index and local documentation links
        run: python3 .github/scripts/pr_quality_docs_policy.py

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test
          requireScope: false

  release-configuration:
    name: Release configuration
    needs: changes
    if: needs.changes.outputs.release_configuration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate superseded Release policy against immutable tags
        shell: pwsh
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-superseded-releases.ps1')
          $superseded = Get-StudioSupersededReleases -WorkspaceRoot $env:GITHUB_WORKSPACE
          Write-Host "Validated $($superseded.Count) superseded Studio Releases"

      - name: Test release reconciliation and platform checksum boundaries
        shell: pwsh
        run: ./.github/scripts/studio-release-assets.tests.ps1

      - name: Validate workflows with actionlint
        uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1.83.0
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: local

      - name: Validate Release Please configuration and dry run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_BRANCH: ${{ github.head_ref || github.ref_name }}
          VALIDATION_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -o pipefail
          python3 -m json.tool release-please-config.json > /dev/null
          python3 -m json.tool .release-please-manifest.json > /dev/null

          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          for attempt in 1 2 3; do
            if npx --yes release-please@17.11.2 release-pr \
              --dry-run \
              --repo-url="$VALIDATION_REPOSITORY" \
              --target-branch="$VALIDATION_BRANCH" \
              --config-file=release-please-config.json \
              --manifest-file=.release-please-manifest.json \
              --token="$GH_TOKEN" 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if ! grep -Fq 'GraphqlResponseError:' "$log_file"; then
              exit 1
            fi
            if ! grep -Fq 'Something went wrong while executing your query' "$log_file" \
              && ! grep -Fq "We couldn't respond to your request in time" "$log_file"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

  # Frontend-only changes use the shared image, but never compile Rust tools.
  flutter-checks:
    name: Flutter and Client (Linux, no bridge)
    needs: [changes, linux-environment]
    if: needs.changes.outputs.client_checks == 'true' || needs.changes.outputs.flutter_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact Linux environment
        uses: ./.github/actions/restore-linux-environment
        with:
          image-ref: ${{ needs.linux-environment.outputs.imageRef }}
          image-id: ${{ needs.linux-environment.outputs.imageId }}
          artifact-id: ${{ needs.linux-environment.outputs.artifactId }}
          archive-sha256: ${{ needs.linux-environment.outputs.archiveSha256 }}
      - name: Check frontend contracts and production UI components
        env:
          CHECK_CLIENT: ${{ needs.changes.outputs.client_checks }}
          CHECK_APP: ${{ needs.changes.outputs.flutter_checks }}
        run: |
          checks=()
          if [ "$CHECK_CLIENT" = true ]; then checks+=(--client); fi
          if [ "$CHECK_APP" = true ]; then checks+=(--app); fi
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash .github/scripts/pr-quality-flutter.sh "${checks[@]}"

  linux-environment:
    name: Prepare exact Linux build environment
    needs: changes
    if: needs.changes.outputs.linux_environment == 'true'
    uses: ./.github/workflows/linux-build-environment.yml
    with:
      sourceRef: ${{ github.sha }}
    permissions:
      contents: read

  rust-checks:
    name: Rust quality, workspace tests and server (Linux)
    needs: [changes, linux-environment]
    if: needs.changes.outputs.rust_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Omit DWARF in Linux CI; keep assertions and leave disk for native GUI outputs.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact Linux environment
        uses: ./.github/actions/restore-linux-environment
        with:
          image-ref: ${{ needs.linux-environment.outputs.imageRef }}
          image-id: ${{ needs.linux-environment.outputs.imageId }}
          artifact-id: ${{ needs.linux-environment.outputs.artifactId }}
          archive-sha256: ${{ needs.linux-environment.outputs.archiveSha256 }}
      - name: Cache container Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ needs.linux-environment.outputs.key }}
          cmd-format: bash docker/linux/scripts/run.sh "${{ env.LINUX_BUILD_IMAGE }}" {0}
          save-if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-bin: false
      - name: Check formatting and isolated dependency contracts
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            cargo fmt --all --check
            # Run before workspace feature unification.
            cargo test --locked -p pl-agent-tool --no-default-features
            cargo test --locked -p pl-agent-tool --no-default-features --features typed
            cargo test --locked --manifest-path code/pl-agent-tool/fixtures/downstream/Cargo.toml --target-dir target/tool-downstream
            python3 .github/scripts/check_tool_boundaries.py
            cargo test --locked --all-targets --manifest-path code/tools/fixtures/downstream/Cargo.toml --target-dir target/tools-downstream
            cargo check --locked -p pl-core --no-default-features --all-targets
          '
      - name: Check workspace Clippy
        run: bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build the current-source remote supervisor
        run: bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" cargo build --locked -p pl-remote-helper
      - name: Compile workspace tests with SQLite enabled
        run: bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" cargo test --locked --workspace --features pl-core/sqlite --no-run
      - name: Run workspace behavior and documentation tests
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            export PATH="$PWD/target/debug:$PATH"
            cargo test --locked --workspace --features pl-core/sqlite
          '
      - name: Build the standalone server
        run: bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" cargo build --locked -p pl-studio-server

  linux-inputs:
    name: Compile Linux engineering tool and bundled helpers
    needs: [changes, linux-environment]
    if: needs.changes.outputs.linux_inputs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    permissions:
      contents: read
    outputs:
      artifactId: ${{ steps.archive.outputs.artifact-id }}
      archiveSha256: ${{ steps.checkpoint.outputs.archiveSha256 }}
      sourceSha: ${{ steps.checkpoint.outputs.sourceSha }}
      workspace: ${{ steps.checkpoint.outputs.workspace }}
      environment: ${{ steps.checkpoint.outputs.environment }}
      helperArtifactId: ${{ steps.helper-archive.outputs.artifact-id }}
      helperArchiveSha256: ${{ steps.helper-checkpoint.outputs.archiveSha256 }}
      helperSourceSha: ${{ steps.helper-checkpoint.outputs.sourceSha }}
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact Linux environment
        uses: ./.github/actions/restore-linux-environment
        with:
          image-ref: ${{ needs.linux-environment.outputs.imageRef }}
          image-id: ${{ needs.linux-environment.outputs.imageId }}
          artifact-id: ${{ needs.linux-environment.outputs.artifactId }}
          archive-sha256: ${{ needs.linux-environment.outputs.archiveSha256 }}
      - name: Cache container Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ needs.linux-environment.outputs.key }}
          cmd-format: bash docker/linux/scripts/run.sh "${{ env.LINUX_BUILD_IMAGE }}" {0}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-bin: false
          workspaces: |
            . -> target
            . -> target/xtask
      - name: Build xtask and selected helper targets in one container
        env:
          BUILD_HELPERS: ${{ needs.changes.outputs.remote_helpers }}
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            cargo build --locked --target-dir target/xtask -p pl-xtask
            if [ "$1" = true ]; then
              PURE_REMOTE_HELPER_BUILDER=zigbuild target/xtask/debug/pl-xtask build-remote-helper --all-targets
            fi
          ' -- "$BUILD_HELPERS"
      - name: Checkpoint only the engineering executable
        id: checkpoint
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/pr_quality_handoff.py pack-tool \
            --archive "$RUNNER_TEMP/quality.tar.gz" --source-sha "$SOURCE_SHA" \
            --environment "$LINUX_BUILD_IMAGE"
      - name: Share the exact tool archive
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-linux-tools-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Checkpoint the two target resources
        id: helper-checkpoint
        if: needs.changes.outputs.remote_helpers == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/helpers"
          python3 .github/scripts/pr_quality_handoff.py pack-helpers \
            --archive "$RUNNER_TEMP/helpers/quality.tar.gz" --source-sha "$SOURCE_SHA"
      - name: Share the exact helper archive
        id: helper-archive
        if: needs.changes.outputs.remote_helpers == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-bundled-helpers-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/helpers/quality.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  gui-generated:
    name: Canonical GUI generation (Linux)
    needs: [changes, linux-environment, linux-inputs]
    if: needs.changes.outputs.gui_generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact Linux environment
        uses: ./.github/actions/restore-linux-environment
        with:
          image-ref: ${{ needs.linux-environment.outputs.imageRef }}
          image-id: ${{ needs.linux-environment.outputs.imageId }}
          artifact-id: ${{ needs.linux-environment.outputs.artifactId }}
          archive-sha256: ${{ needs.linux-environment.outputs.archiveSha256 }}
      - name: Restore this run's Linux engineering tool
        uses: ./.github/actions/restore-quality-artifact
        with:
          kind: tool
          artifact-id: ${{ needs.linux-inputs.outputs.artifactId }}
          sha256: ${{ needs.linux-inputs.outputs.archiveSha256 }}
          source-sha: ${{ needs.linux-inputs.outputs.sourceSha }}
          workspace: ${{ needs.linux-inputs.outputs.workspace }}
          environment: ${{ needs.linux-inputs.outputs.environment }}
      - name: Check generated sources once without repeating Rust quality or UI tests
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            cargo binstall --root "$HOME/.quality-tools" --no-confirm --force --disable-strategies compile \
              flutter_rust_bridge_codegen@2.13.0 cargo-expand@1.0.127
            export PATH="$HOME/.quality-tools/bin:$PATH"
            "$1" check-gui-generated
          ' -- "$PR_QUALITY_XTASK"

  linux-desktop:
    name: Desktop integration (Linux, shard ${{ matrix.shard }})
    needs: [changes, linux-environment, linux-inputs]
    if: needs.changes.outputs.linux_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DESKTOP_TEST_OUTPUT: output/ci-desktop-linux/${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact Linux environment
        uses: ./.github/actions/restore-linux-environment
        with:
          image-ref: ${{ needs.linux-environment.outputs.imageRef }}
          image-id: ${{ needs.linux-environment.outputs.imageId }}
          artifact-id: ${{ needs.linux-environment.outputs.artifactId }}
          archive-sha256: ${{ needs.linux-environment.outputs.archiveSha256 }}
      # Non-exact Rust cache restores may clean target; restore this run's tool afterwards.
      - name: Cache container Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ needs.linux-environment.outputs.key }}
          cmd-format: bash docker/linux/scripts/run.sh "${{ env.LINUX_BUILD_IMAGE }}" {0}
          save-if: ${{ matrix.shard == 0 && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-bin: false
      - name: Restore this run's Linux engineering tool
        uses: ./.github/actions/restore-quality-artifact
        with:
          kind: tool
          artifact-id: ${{ needs.linux-inputs.outputs.artifactId }}
          sha256: ${{ needs.linux-inputs.outputs.archiveSha256 }}
          source-sha: ${{ needs.linux-inputs.outputs.sourceSha }}
          workspace: ${{ needs.linux-inputs.outputs.workspace }}
          environment: ${{ needs.linux-inputs.outputs.environment }}
      - name: Restore this run's bundled helper inputs
        uses: ./.github/actions/restore-quality-artifact
        with:
          kind: helpers
          artifact-id: ${{ needs.linux-inputs.outputs.helperArtifactId }}
          sha256: ${{ needs.linux-inputs.outputs.helperArchiveSha256 }}
          source-sha: ${{ needs.linux-inputs.outputs.helperSourceSha }}
      # A shard owns its checkout, display and fixtures. Cases inside it stay
      # sequential so no two Flutter processes rewrite the same build inputs.
      - name: Record disk usage before desktop build
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for directory in target output/ci-cargo-home "$RUNNER_TEMP"; do
            if [ -d "$directory" ]; then
              du -sh "$directory"
            else
              printf 'Not created: %s\n' "$directory"
            fi
          done
      - name: Run the complete selected desktop shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            export PATH="$PURE_REMOTE_HELPER_PREBUILT_DIR/x86_64-unknown-linux-musl:$PATH"
            bash .github/scripts/linux-desktop-session.sh output/ci-desktop-secret-service \
              xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
              "$1" test-project --suite desktop --set full \
              --shard-index "$2" --shard-count 3 --output "$3"
          ' -- "$PR_QUALITY_XTASK" "$SHARD_INDEX" "$DESKTOP_TEST_OUTPUT"
      - name: Record disk usage after desktop build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for directory in target output/ci-cargo-home "$RUNNER_TEMP"; do
            if [ -d "$directory" ]; then
              du -sh "$directory"
            else
              printf 'Not created: %s\n' "$directory"
            fi
          done
      - name: Preserve desktop reports and runner logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.DESKTOP_TEST_OUTPUT }}/report.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/report.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/realtime-live-text-*.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/realtime-exec-receipts-*.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/timeline-history-live.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/timeline-history-restart.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/timeline-history-continuity.log
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/fixture-status.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/fixture.log
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/requests.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/timeline-concept.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/timeline-concept-reopen.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/timeline-concept-media-missing.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/wait-events-captures.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/realtime-tool-observation*.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/sidebar-shutdown.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/sidebar-mutations-before-shutdown.json
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/sidebar-fixture-cleanup.jsonl
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/gui.log
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/*-integration.log
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/*-driver.log
            ${{ env.DESKTOP_TEST_OUTPUT }}/cases/**/*-errors.txt
          if-no-files-found: warn
          retention-days: 7

  linux-native:
    name: Native lifecycle integration (Linux)
    needs: [changes, linux-environment, linux-inputs]
    if: needs.changes.outputs.linux_native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NATIVE_TEST_OUTPUT: output/ci-native-linux/${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact Linux environment
        uses: ./.github/actions/restore-linux-environment
        with:
          image-ref: ${{ needs.linux-environment.outputs.imageRef }}
          image-id: ${{ needs.linux-environment.outputs.imageId }}
          artifact-id: ${{ needs.linux-environment.outputs.artifactId }}
          archive-sha256: ${{ needs.linux-environment.outputs.archiveSha256 }}
      # Non-exact Rust cache restores may clean target; restore this run's tool afterwards.
      - name: Cache container Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ needs.linux-environment.outputs.key }}
          cmd-format: bash docker/linux/scripts/run.sh "${{ env.LINUX_BUILD_IMAGE }}" {0}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-bin: false
      - name: Restore this run's Linux engineering tool
        uses: ./.github/actions/restore-quality-artifact
        with:
          kind: tool
          artifact-id: ${{ needs.linux-inputs.outputs.artifactId }}
          sha256: ${{ needs.linux-inputs.outputs.archiveSha256 }}
          source-sha: ${{ needs.linux-inputs.outputs.sourceSha }}
          workspace: ${{ needs.linux-inputs.outputs.workspace }}
          environment: ${{ needs.linux-inputs.outputs.environment }}
      - name: Restore this run's bundled helper inputs
        uses: ./.github/actions/restore-quality-artifact
        with:
          kind: helpers
          artifact-id: ${{ needs.linux-inputs.outputs.helperArtifactId }}
          sha256: ${{ needs.linux-inputs.outputs.helperArchiveSha256 }}
          source-sha: ${{ needs.linux-inputs.outputs.helperSourceSha }}
      - name: Record disk usage before native build
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for directory in target output/ci-cargo-home "$RUNNER_TEMP"; do
            if [ -d "$directory" ]; then
              du -sh "$directory"
            else
              printf 'Not created: %s\n' "$directory"
            fi
          done
      - name: Run the full native lifecycle suite
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" bash -euo pipefail -c '
            export PATH="$PURE_REMOTE_HELPER_PREBUILT_DIR/x86_64-unknown-linux-musl:$PATH"
            bash .github/scripts/linux-desktop-session.sh output/ci-native-secret-service \
              xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
              "$1" test-project --suite native --set full --output "$2"
          ' -- "$PR_QUALITY_XTASK" "$NATIVE_TEST_OUTPUT"
      - name: Record disk usage after native build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for directory in target output/ci-cargo-home "$RUNNER_TEMP"; do
            if [ -d "$directory" ]; then
              du -sh "$directory"
            else
              printf 'Not created: %s\n' "$directory"
            fi
          done
      - name: Preserve native reports and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.NATIVE_TEST_OUTPUT }}/report.json
            ${{ env.NATIVE_TEST_OUTPUT }}/cases/**/report.json
            ${{ env.NATIVE_TEST_OUTPUT }}/cases/**/shutdown-*-gui.log
            ${{ env.NATIVE_TEST_OUTPUT }}/cases/**/shutdown-launch-*.json
            ${{ env.NATIVE_TEST_OUTPUT }}/cases/**/shutdown-native-exit-*.json
            ${{ env.NATIVE_TEST_OUTPUT }}/cases/**/shutdown-assembly-*.jsonl
            ${{ env.NATIVE_TEST_OUTPUT }}/cases/**/shutdown-stage*
            ${{ env.NATIVE_TEST_OUTPUT }}/cases/**/diagnostics.json
            ${{ env.NATIVE_TEST_OUTPUT }}/cases/**/diagnostics/**/anywork-exit-diagnostics.log
          if-no-files-found: warn
          retention-days: 7

  windows-build:
    name: Clippy and GUI build (Windows)
    needs: [changes, linux-inputs]
    # Test-only Rust changes need host Clippy, but no Linux helper producer.
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.windows_build == 'true' &&
      (needs.changes.outputs.windows_gui_build != 'true' || needs.linux-inputs.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore this run's bundled helper inputs
        if: needs.changes.outputs.windows_gui_build == 'true'
        uses: ./.github/actions/restore-quality-artifact
        with:
          kind: helpers
          artifact-id: ${{ needs.linux-inputs.outputs.helperArtifactId }}
          sha256: ${{ needs.linux-inputs.outputs.helperArchiveSha256 }}
          source-sha: ${{ needs.linux-inputs.outputs.helperSourceSha }}
      - name: Set up cached native Rust build
        uses: ./.github/actions/setup-studio-rust
      - name: Set up Flutter
        if: needs.changes.outputs.windows_gui_build == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Prepare Clippy for Rust changes
        if: needs.changes.outputs.rust_checks == 'true'
        run: rustup component add clippy
      - name: Check Rust on Windows
        if: needs.changes.outputs.rust_checks == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compile the application in debug mode without running tests
        if: needs.changes.outputs.windows_gui_build == 'true'
        run: cargo xtask build-gui --debug

  macos-build:
    name: Clippy and GUI build (macOS)
    needs: [changes, linux-inputs]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.macos_build == 'true' &&
      (needs.changes.outputs.macos_gui_build != 'true' || needs.linux-inputs.result == 'success')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore this run's bundled helper inputs
        if: needs.changes.outputs.macos_gui_build == 'true'
        uses: ./.github/actions/restore-quality-artifact
        with:
          kind: helpers
          artifact-id: ${{ needs.linux-inputs.outputs.helperArtifactId }}
          sha256: ${{ needs.linux-inputs.outputs.helperArchiveSha256 }}
          source-sha: ${{ needs.linux-inputs.outputs.helperSourceSha }}
      - name: Set up cached native Rust build
        uses: ./.github/actions/setup-studio-rust
      - name: Set up Flutter
        if: needs.changes.outputs.macos_gui_build == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Prepare Clippy for Rust changes
        if: needs.changes.outputs.rust_checks == 'true'
        run: rustup component add clippy
      - name: Check Rust on macOS
        if: needs.changes.outputs.rust_checks == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compile the application in debug mode without running tests
        if: needs.changes.outputs.macos_gui_build == 'true'
        run: cargo xtask build-gui --debug

  # Configure this stable aggregate as the repository required check.
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - changes
      - docs-policy
      - pr-title
      - release-configuration
      - flutter-checks
      - linux-environment
      - rust-checks
      - linux-inputs
      - gui-generated
      - linux-desktop
      - linux-native
      - windows-build
      - macos-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify all required results against the path plan
        env:
          REQUIRED_JOBS: ${{ needs.changes.outputs.required_jobs }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_POLICY_RESULT: ${{ needs.docs-policy.result }}
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
          RELEASE_CONFIGURATION_RESULT: ${{ needs.release-configuration.result }}
          FLUTTER_CHECKS_RESULT: ${{ needs.flutter-checks.result }}
          LINUX_ENVIRONMENT_RESULT: ${{ needs.linux-environment.result }}
          RUST_CHECKS_RESULT: ${{ needs.rust-checks.result }}
          LINUX_INPUTS_RESULT: ${{ needs.linux-inputs.result }}
          GUI_GENERATED_RESULT: ${{ needs.gui-generated.result }}
          LINUX_DESKTOP_RESULT: ${{ needs.linux-desktop.result }}
          LINUX_NATIVE_RESULT: ${{ needs.linux-native.result }}
          WINDOWS_BUILD_RESULT: ${{ needs.windows-build.result }}
          MACOS_BUILD_RESULT: ${{ needs.macos-build.result }}
        run: python3 .github/scripts/pr_quality_gate.py
