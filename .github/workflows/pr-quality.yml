name: PR Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

# A newer commit on the same pull request cancels its superseded run. Branch pushes use
# their own run id instead, so a queued run is never replaced by a newer one.
concurrency:
  group: pr-quality-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test
          requireScope: false

  release-configuration:
    name: Release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate superseded Release policy against immutable tags
        shell: pwsh
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/studio-superseded-releases.ps1')
          $superseded = Get-StudioSupersededReleases -WorkspaceRoot $env:GITHUB_WORKSPACE
          Write-Host "Validated $($superseded.Count) superseded Studio Releases"

      - name: Validate workflows with actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: local

      - name: Validate Release Please configuration and dry run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_BRANCH: ${{ github.head_ref || github.ref_name }}
          VALIDATION_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -o pipefail
          python3 -m json.tool release-please-config.json > /dev/null
          python3 -m json.tool .release-please-manifest.json > /dev/null

          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          for attempt in 1 2 3; do
            if npx --yes release-please@17.10.4 release-pr \
              --dry-run \
              --repo-url="$VALIDATION_REPOSITORY" \
              --target-branch="$VALIDATION_BRANCH" \
              --config-file=release-please-config.json \
              --manifest-file=.release-please-manifest.json \
              --token="$GH_TOKEN" 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if ! grep -Fq 'GraphqlResponseError:' "$log_file"; then
              exit 1
            fi
            if ! grep -Fq 'Something went wrong while executing your query' "$log_file" \
              && ! grep -Fq "We couldn't respond to your request in time" "$log_file"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

  rust-quality:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Check standalone core without database features
        run: cargo check -p pl-core --no-default-features --all-targets

      - name: Check core SQLite backend
        run: cargo check -p pl-core --no-default-features --features sqlite --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test pl-model public API
        run: cargo test -p pl-model

      - name: Test pl-core public API
        run: cargo test -p pl-core --features sqlite

      - name: Test pl-patch semantics
        run: cargo test -p pl-patch

  studio-server-linux:
    name: Studio server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build standalone Studio server
        run: cargo build -p pl-studio-server

      # The Studio history tests load the worker from PATH, so install the debug binary
      # from this checkout into the shared workspace target directory. The install reuses
      # the debug dependencies built for the server and the tests; release helpers keep
      # their optimized musl builds.
      - name: Install local execution worker
        run: cargo install --path code/pl-remote-helper --locked --debug --target-dir "${{ github.workspace }}/target"

      - name: Test Studio history persistence
        run: cargo test -p pl-studio-runtime

  flutter-quality:
    name: Flutter
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            . -> target/xtask

      - name: Set up cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
        with:
          version: 1.26.0

      # FRB otherwise installs cargo-expand from source during generation.
      - name: Install prebuilt FRB tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --force --disable-strategies compile flutter_rust_bridge_codegen@2.13.0 cargo-expand@1.0.127

      # 确定性 Client/adapter 与 GUI 静态门禁。原生 Driver/live 人工验收
      # 按实际宿主平台单独记录（见 AGENTS.md），不由此推断跨平台通过。
      - name: Verify Dart Client and adapter contracts
        run: cargo xtask verify-client

      - name: Verify Flutter application
        run: cargo xtask verify-gui
