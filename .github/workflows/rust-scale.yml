name: Rust Scale Checks

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: rust-scale-${{ github.ref }}

jobs:
  linux-environment:
    uses: ./.github/workflows/linux-build-environment.yml
    permissions:
      contents: read
    with:
      sourceRef: ${{ github.sha }}

  rust-scale:
    needs: linux-environment
    uses: ./.github/workflows/rust-scale-checks.yml
    permissions:
      contents: read
    with:
      environmentKey: ${{ needs.linux-environment.outputs.key }}
      imageRef: ${{ needs.linux-environment.outputs.imageRef }}
      imageId: ${{ needs.linux-environment.outputs.imageId }}
      artifactId: ${{ needs.linux-environment.outputs.artifactId }}
      archiveSha256: ${{ needs.linux-environment.outputs.archiveSha256 }}
