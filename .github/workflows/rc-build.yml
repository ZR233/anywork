name: RC Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"

jobs:
  helper:
    name: Build Linux remote helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install pinned Zig and cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-0.16.0.tar.xz"
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$archive"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$archive" | sha256sum --check
          tool_dir="$RUNNER_TEMP/zig-0.16.0"
          mkdir -p "$tool_dir"
          tar -xJf "$archive" --strip-components=1 -C "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.23.4 --locked
      - name: Build all remote helper architectures
        env:
          PURE_REMOTE_HELPER_BUILDER: zigbuild
        run: cargo xtask build-remote-helper --all-targets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-bundled-helper-${{ github.sha }}
          path: dist/remote-helper/**
          if-no-files-found: error
          compression-level: 0

  build:
    name: Build (${{ matrix.os }})
    needs: helper
    runs-on: ${{ matrix.os }}
    env:
      PURE_REMOTE_HELPER_PREBUILT_DIR: ${{ github.workspace }}/dist/remote-helper
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rc-bundled-helper-${{ github.sha }}
          path: dist/remote-helper
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          cache: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install FRB code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Build GUI artifact
        run: cargo xtask build-gui --check-generated
      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anywork-${{ matrix.os }}
          path: dist/anywork-release/**
