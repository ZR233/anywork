name: RC Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"

jobs:
  helper:
    name: Build Linux remote helper (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Same helper build as the stable publisher; the pinned Zig toolchain versions
          # are part of the key because they are not Cargo inputs.
          shared-key: helper-linux-zig-0.16.0-zigbuild-0.23.4-${{ matrix.target }}
          workspaces: |
            . -> target
            . -> target/xtask
      - name: Set up cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
        with:
          version: 1.26.0
      - name: Install pinned Zig and cargo-zigbuild
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-0.16.0.tar.xz"
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$archive"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$archive" | sha256sum --check
          tool_dir="$RUNNER_TEMP/zig-0.16.0"
          mkdir -p "$tool_dir"
          tar -xJf "$archive" --strip-components=1 -C "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
          cargo binstall --no-confirm --force --disable-strategies compile cargo-zigbuild@0.23.4
      - name: Build remote helper architecture
        env:
          PURE_REMOTE_HELPER_BUILDER: zigbuild
        run: cargo xtask build-remote-helper --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-bundled-helper-${{ github.sha }}-${{ matrix.target }}
          path: dist/remote-helper/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0

  build:
    name: Build (${{ matrix.os }})
    needs: helper
    runs-on: ${{ matrix.os }}
    env:
      PURE_REMOTE_HELPER_PREBUILT_DIR: ${{ github.workspace }}/dist/remote-helper
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rc-bundled-helper-${{ github.sha }}-x86_64-unknown-linux-musl
          path: dist/remote-helper/x86_64-unknown-linux-musl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rc-bundled-helper-${{ github.sha }}-aarch64-unknown-linux-musl
          path: dist/remote-helper/aarch64-unknown-linux-musl
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          cache: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1

      # Rust Cache hashes every installed rustup toolchain into its environment key, and
      # the hosted image's preinstalled `stable` moves independently of the toolchain pinned
      # in rust-toolchain.toml. Only that unused preinstalled `stable` toolchain is removed
      # on this temporary runner, so the cache identity follows the compiler this job uses.
      - name: Remove unused preinstalled stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_listing="$(rustup show active-toolchain)"
          toolchains="$(rustup toolchain list)"
          active="${active_listing%%[[:space:]]*}"
          if [ -z "$active" ]; then
            echo 'rustup did not report an active toolchain' >&2
            exit 1
          fi
          while IFS= read -r listing; do
            name="${listing%%[[:space:]]*}"
            case "$name" in
              stable-*) ;;
              *) continue ;;
            esac
            if [ "$name" = "$active" ]; then
              continue
            fi
            echo "Removing unused preinstalled toolchain $name"
            rustup toolchain uninstall "$name"
          done <<< "$toolchains"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Same Windows GUI product set as the stable publisher build.
          shared-key: gui-windows
          workspaces: |
            . -> target
            . -> target/xtask
      - name: Build GUI artifact
        run: cargo xtask build-gui
      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anywork-${{ matrix.os }}
          path: dist/anywork-release/**
