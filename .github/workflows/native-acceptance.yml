name: Native Acceptance

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - 'code/**'
      - 'xtask/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-acceptance.yml'
  workflow_dispatch:
    inputs:
      scenario:
        description: Native scenario to observe
        type: choice
        default: all
        options:
          - all
          - realtime
          - timeline-history
          - stress-body-large
          - plan-recovery

permissions:
  contents: read

concurrency:
  group: native-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NATIVE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  helper:
    name: Native helper (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'native-acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Check out acceptance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NATIVE_SOURCE_SHA }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Set up cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
        with:
          version: 1.26.0
      - name: Install pinned helper builder
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-0.16.0.tar.xz"
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$archive"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$archive" | sha256sum --check
          tool_dir="$RUNNER_TEMP/zig-0.16.0"
          mkdir -p "$tool_dir"
          tar -xJf "$archive" --strip-components=1 -C "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
          cargo binstall --no-confirm --force --disable-strategies compile cargo-zigbuild@0.23.4
      - name: Build helper from the acceptance source
        env:
          PURE_REMOTE_HELPER_BUILDER: zigbuild
        run: cargo xtask build-remote-helper --target ${{ matrix.target }}
      - name: Preserve helper and build identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-helper-${{ matrix.target }}
          path: dist/remote-helper/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows native Driver and profile
    needs: helper
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PURE_REMOTE_HELPER_PREBUILT_DIR: ${{ github.workspace }}/dist/remote-helper
    steps:
      - name: Check out acceptance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NATIVE_SOURCE_SHA }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Download x64 helper from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-helper-x86_64-unknown-linux-musl
          path: dist/remote-helper/x86_64-unknown-linux-musl
      - name: Download arm64 helper from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-helper-aarch64-unknown-linux-musl
          path: dist/remote-helper/aarch64-unknown-linux-musl
      - name: Record source, platform and native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'target/native-acceptance'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $nativeTemp = Join-Path $env:RUNNER_TEMP 'native-acceptance'
          New-Item -ItemType Directory -Force -Path $nativeTemp | Out-Null
          "TEMP=$nativeTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$nativeTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $actualSource = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualSource -ne $env:NATIVE_SOURCE_SHA) { throw 'Acceptance source does not match the requested commit' }
          $identity = [ordered]@{
            source = $actualSource
            workflowRun = $env:GITHUB_RUN_ID
            workflowAttempt = $env:GITHUB_RUN_ATTEMPT
            operatingSystem = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
            graphics = @(Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM)
            evidenceScope = 'Hosted Windows native execution; profile frames are specific to this runner and its renderer'
            humanVerdict = 'pending'
          }
          $identity | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $evidence 'platform.json')
          cargo flutter doctor -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Rust bridge for native profile
        if: github.event_name != 'workflow_dispatch' || inputs.scenario != 'plan-recovery'
        run: cargo build --locked -p pl-studio-bridge --release
      - name: Observe realtime native profile
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'realtime'
        run: cargo xtask manual-gui --scenario realtime --output target/native-acceptance/realtime
      - name: Observe completed history, concurrent reading and cold restart profile
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'timeline-history'
        run: cargo xtask manual-gui --scenario timeline-history --output target/native-acceptance/timeline-history
      - name: Observe full large-body detail and copy profile
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'stress-body-large'
        run: cargo xtask manual-gui --scenario stress-body-large --output target/native-acceptance/stress-body-large
      - name: Build Rust bridge for native debug
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'plan-recovery'
        run: cargo build --locked -p pl-studio-bridge
      - name: Observe plan recovery native debug
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'plan-recovery'
        run: cargo xtask manual-gui --scenario plan-recovery --output target/native-acceptance/plan-recovery
      - name: Check that native observation did not modify tracked inputs
        run: git diff --exit-code
      - name: Preserve formal native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-${{ env.NATIVE_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            target/native-acceptance/**/*.json
            target/native-acceptance/**/*.png
            target/native-acceptance/**/*.log
            target/native-acceptance/**/*.txt
            !target/native-acceptance/**/environment-*/**
            !target/native-acceptance/**/home/**
            !target/native-acceptance/**/retained-environment.json
          if-no-files-found: error
          retention-days: 14
