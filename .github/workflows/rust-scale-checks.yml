name: Run Rust Scale Checks

on:
  workflow_call:
    inputs:
      environmentKey:
        required: true
        type: string
      imageRef:
        required: true
        type: string
      imageId:
        type: string
      artifactId:
        type: string
      archiveSha256:
        type: string

permissions: {}

jobs:
  rust-scale:
    name: Runtime scale (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact Linux environment
        uses: ./.github/actions/restore-linux-environment
        with:
          image-ref: ${{ inputs.imageRef }}
          image-id: ${{ inputs.imageId }}
          artifact-id: ${{ inputs.artifactId }}
          archive-sha256: ${{ inputs.archiveSha256 }}
      - name: Cache container Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-workspace-${{ inputs.environmentKey }}
          cmd-format: bash docker/linux/scripts/run.sh "${{ env.LINUX_BUILD_IMAGE }}" {0}
          save-if: false
          cache-bin: false
      - name: Verify indexed history at one hundred thousand records
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" cargo test --locked -p pl-studio-runtime --lib \
            history::scale::hundred_thousand_events_use_index_seeks_without_loading_bodies \
            -- --exact --ignored --nocapture
      - name: Verify current and history at two thousand items
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" cargo test --locked -p pl-studio-runtime \
            --test runtime_conversation_feed current_and_history_2000_item_scale -- --exact --ignored --nocapture
      - name: Verify the complete model stream
        run: |
          bash docker/linux/scripts/run.sh "$LINUX_BUILD_IMAGE" cargo test --locked -p pl-model --test protocol_wire \
            full_gui_stress_stream_reaches_model_public_api_without_loss -- --exact --ignored --nocapture
