include = [{ path = "config.local.toml", optional = true }]

[env]
# Bound local HTTP/SSE, git, and SQLite test resource usage on Windows.
RUST_TEST_THREADS = { value = "4", force = false }

[alias]
xtask = "run --locked --target-dir target/xtask -p pl-xtask --"
flutter = "run --locked --target-dir target/xtask -p pl-xtask -- flutter"
dart = "run --locked --target-dir target/xtask -p pl-xtask -- dart"
